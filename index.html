<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --bg:#0b0e14;--bg2:#0f131c;--panel:#131826;--panel2:#171d2e;--line:#232a3d;--line2:#2e3750;
 --tx:#d7dceb;--tx2:#8b93a8;--tx3:#5f6880;
 --up:#f5484d;--dn:#00b578;--fl:#6b7488;--acc:#ffb020;--acc2:#4c8dff;
 --shadow:0 1px 3px rgba(0,0,0,.5);
}
html[data-t=light]{
 --bg:#f2f4f8;--bg2:#e9ecf2;--panel:#fff;--panel2:#f7f8fb;--line:#e0e4ec;--line2:#ccd3e0;
 --tx:#1b2333;--tx2:#5a6377;--tx3:#8b93a5;
 --up:#e0322f;--dn:#00a06a;--fl:#98a0b0;--acc:#d98500;--acc2:#2668d8;
 --shadow:0 1px 3px rgba(16,24,40,.08);
}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",
 "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
 padding:0 0 40px;transition:background .18s,color .18s;-webkit-font-smoothing:antialiased}
.mono,.num,td.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
 font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.wrap{max-width:1360px;margin:0 auto;padding:0 16px}
.up{color:var(--up)}.down{color:var(--dn)}.flat{color:var(--fl)}.dim{color:var(--tx3)}
.n{color:var(--tx)}
/* header */
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 90%,transparent);
 backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:10px;padding:10px 0;flex-wrap:wrap}
.logo{width:26px;height:26px;flex:0 0 auto;border-radius:6px}
h1{font-size:16px;font-weight:650;letter-spacing:.2px;white-space:nowrap}
.dt{font:600 12px/1 ui-monospace,monospace;color:var(--acc);
 background:color-mix(in srgb,var(--acc) 14%,transparent);
 border:1px solid color-mix(in srgb,var(--acc) 32%,transparent);padding:5px 8px;border-radius:5px}
.dt.new::after{content:"最新";font-size:9px;background:var(--up);color:#fff;border-radius:3px;
 padding:1px 3px;margin-left:5px;vertical-align:1px;font-weight:700}
.srcs{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.src{font-size:11px;color:var(--tx2);background:var(--panel);border:1px solid var(--line);
 padding:4px 8px;border-radius:20px;white-space:nowrap}
.src b{color:var(--tx);font-weight:600}
.tt{cursor:pointer;background:var(--panel);border:1px solid var(--line);color:var(--tx);
 border-radius:7px;padding:6px 11px;font-size:12px;display:flex;align-items:center;gap:5px;
 transition:.15s;white-space:nowrap}
.tt:hover{border-color:var(--acc);color:var(--acc)}
/* 日期切换条 */
.dbar{display:flex;align-items:center;gap:8px;padding:0 0 9px;flex-wrap:nowrap}
.dlab{font-size:11px;color:var(--tx3);white-space:nowrap;flex:0 0 auto}
.dsw{display:flex;gap:5px;overflow-x:auto;padding:2px 1px;scrollbar-width:thin;
 -webkit-overflow-scrolling:touch;flex:1 1 auto}
.dsw::-webkit-scrollbar{height:4px}
.dsw::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px}
.dp{flex:0 0 auto;cursor:pointer;background:var(--panel);border:1px solid var(--line);
 color:var(--tx2);border-radius:7px;padding:5px 9px;font:600 11.5px/1.25 ui-monospace,monospace;
 transition:.13s;text-align:center;min-width:64px}
.dp small{display:block;font-size:9.5px;font-weight:500;opacity:.8;margin-top:2px;
 font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.dp:hover{border-color:var(--acc2);color:var(--tx)}
.dp.on{background:var(--acc2);border-color:var(--acc2);color:#fff;box-shadow:var(--shadow)}
.dp.on small{opacity:.92}
.nv{flex:0 0 auto;cursor:pointer;background:var(--panel);border:1px solid var(--line);
 color:var(--tx2);border-radius:7px;width:26px;height:30px;font-size:13px;line-height:1;
 transition:.13s}
.nv:hover:not(:disabled){border-color:var(--acc2);color:var(--tx)}
.nv:disabled{opacity:.32;cursor:not-allowed}
/* overview */
.ovs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.ov{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px 14px;
 box-shadow:var(--shadow);position:relative;overflow:hidden}
.ov::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc2);opacity:.7}
.ov:nth-child(2)::before{background:var(--up)}.ov:nth-child(3)::before{background:var(--acc)}
.ov:nth-child(4)::before{background:var(--dn)}
.ol{font-size:11.5px;color:var(--tx2);margin-bottom:5px;letter-spacing:.3px}
.ovv{display:flex;align-items:baseline;gap:5px}
.ovv .v{font:650 24px/1.15 ui-monospace,monospace;letter-spacing:-.4px;word-break:break-all}
.ovv .u{font-size:13px;font-weight:600;opacity:.85;white-space:nowrap}
.os{font-size:11px;color:var(--tx3);margin-top:5px;line-height:1.4}
/* panel */
section{margin:16px 0}
.pnl{background:var(--panel);border:1px solid var(--line);border-radius:10px;
 box-shadow:var(--shadow);overflow:hidden}
.ph{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);
 background:var(--panel2);flex-wrap:wrap}
.ph h2{font-size:13.5px;font-weight:650;display:flex;align-items:center;gap:7px}
.ph h2::before{content:"";width:3px;height:13px;background:var(--acc);border-radius:2px}
.pd{font-size:11px;color:var(--tx3);flex:1 1 auto}
.pb-body{padding:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .ct{fill:var(--tx);font-size:12px;font-weight:600}
.chart .cs{fill:var(--tx3);font-size:10.5px}
.chart .lb{fill:var(--tx);font-size:11.5px}
.chart .vl{fill:var(--tx);font-size:11px;font-weight:600;font-family:ui-monospace,monospace}
.chart .vs{fill:var(--tx3);font-size:10px;font-family:ui-monospace,monospace}
.chart .vw{fill:#fff;font-size:11px;font-weight:600}
.chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:2 3}
.chart .axis{stroke:var(--line2);stroke-width:1}
.chart .hit{cursor:pointer;fill:transparent}
.chart .hit:hover{fill:var(--tx);opacity:.06}
.chart .selbg{fill:var(--acc2);opacity:.1}
/* table */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
.tbl th{background:var(--panel2);color:var(--tx2);font-weight:600;text-align:left;padding:8px 9px;
 border-bottom:1px solid var(--line2);position:sticky;top:0;z-index:5;font-size:11.5px}
.tbl th.num{text-align:right}
.tbl th.s{cursor:pointer;user-select:none}
.tbl th.s:hover{color:var(--acc)}
.tbl th.s::after{content:"\2645";opacity:.35;margin-left:3px;font-size:9px}
.tbl th.s.asc::after{content:"\2191";opacity:1;color:var(--acc)}
.tbl th.s.desc::after{content:"\2193";opacity:1;color:var(--acc)}
.tbl td{padding:6px 9px;border-bottom:1px solid var(--line)}
.tbl td.num{text-align:right}
.tbl tbody tr:hover{background:var(--panel2)}
.tbl .idx{color:var(--tx3);font-size:11px}
.tbl .nm{font-weight:600}
.tbl .b{font-weight:650}
.tbl .rs{white-space:normal;min-width:200px;max-width:340px;color:var(--tx2);font-size:11px;line-height:1.45}
.tbl .mk{font-size:11px}
.chip{background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;
 color:var(--tx2);font-size:10.5px}
.badge{background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc);border-radius:3px;
 padding:0 4px;font-size:9.5px;margin-left:4px;font-weight:600;vertical-align:1px}
.tg{display:inline-block;background:var(--bg2);border:1px solid var(--line);border-radius:3px;
 padding:1px 5px;margin:1px 3px 1px 0;font-size:10.5px;color:var(--tx2)}
.pb{min-width:110px}
.pbar{display:inline-block;width:56px;height:6px;background:var(--line);border-radius:3px;
 overflow:hidden;vertical-align:middle;margin-right:6px}
.pbar i{display:block;height:100%;background:var(--up);border-radius:3px}
.lead{font-size:11.5px}
.lead b{font-weight:600}
/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:9px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.ch{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.cn{font-weight:650;font-size:12.5px}
.cc{font:600 10.5px/1 ui-monospace,monospace;background:color-mix(in srgb,var(--up) 15%,transparent);
 color:var(--up);padding:3px 5px;border-radius:3px}
.ca{margin-left:auto;font:600 11.5px ui-monospace,monospace}
.cb{display:flex;flex-wrap:wrap;gap:4px}
.sc{font-size:10.5px;background:var(--panel);border:1px solid var(--line);border-radius:4px;
 padding:2px 5px;color:var(--tx2)}
.sc em{font-style:normal;font-family:ui-monospace,monospace;font-weight:600}
.sc.up em{color:var(--up)}.sc.down em{color:var(--dn)}
.sc.dimc{color:var(--tx3)}
/* controls */
.ctl{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-left:auto}
.inp{background:var(--bg2);border:1px solid var(--line);color:var(--tx);border-radius:6px;
 padding:5px 9px;font-size:11.5px;width:150px;outline:none;transition:.15s}
.inp:focus{border-color:var(--acc2)}
.inp::placeholder{color:var(--tx3)}
.tabs{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:2px;gap:2px}
.tab{padding:4px 10px;border-radius:4px;font-size:11.5px;cursor:pointer;color:var(--tx2);
 border:none;background:none;transition:.15s;white-space:nowrap;font-family:inherit}
.tab.on{background:var(--panel);color:var(--tx);font-weight:600;box-shadow:var(--shadow)}
.hidden{display:none!important}
.cnt{font-size:11px;color:var(--tx3);font-family:ui-monospace,monospace}
.empty{padding:22px 14px;color:var(--tx3);font-size:12px;text-align:center}
/* footer */
footer{margin-top:22px;padding:16px;background:var(--panel);border:1px solid var(--line);
 border-radius:10px;font-size:11.5px;color:var(--tx2);line-height:1.75}
footer b{color:var(--tx)}
.fsrc{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px;margin:8px 0 12px}
.fs{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:9px 11px}
.fs .t{color:var(--tx);font-weight:600;margin-bottom:3px;font-size:12px}
.fs .u{font-family:ui-monospace,monospace;font-size:10px;color:var(--tx3);word-break:break-all}
.note{border-top:1px dashed var(--line2);padding-top:10px;margin-top:4px;color:var(--tx3);font-size:11px}
.note ol{margin-left:16px}
@media(max-width:1100px){.ovs{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:640px){
 .wrap{padding:0 10px}h1{font-size:14px}.srcs{display:none}
 .ovs{grid-template-columns:1fr 1fr;gap:8px}.ovv .v{font-size:18px}
 .ph{padding:9px 11px}.pb-body{padding:10px}
 .inp{width:104px}.tbl .rs{max-width:170px}
 .pd{display:none}.dlab{display:none}.dp{min-width:56px;padding:5px 7px}
}
@media print{header{position:static}body{background:#fff}}
</style>
</head>

<script>
(function(){
var P=JSON.parse(document.getElementById('DATA').textContent);
var DAYS=P.days, app=document.getElementById('app'), hroot=document.documentElement;
var cur=(location.hash||'').replace(/^#/,'');
if(DAYS.indexOf(cur)<0) cur=P.latest;
var q={};                      // 各表搜索词（跨日期保留）
var W=680;

/* ---------- 工具 ---------- */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
 .replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function money(v,dec){if(v==null)return '\u2014';dec=(dec==null?2:dec);
 var s=v<0?'-':'',a=Math.abs(v);
 if(a>=1e8)return s+'\xa5'+(a/1e8).toFixed(dec)+'\u4ebf';
 if(a>=1e4)return s+'\xa5'+Math.round(a/1e4)+'\u4e07';
 return s+'\xa5'+Math.round(a);}
function pc(v){return v==null?'\u2014':(v>=0?'+':'')+Number(v).toFixed(2)+'%';}
function cl(v){if(v==null||Math.abs(v)<1e-9)return 'flat';return v>0?'up':'down';}
function wd(d){var t=new Date(d+'T00:00:00Z');return '\u5468'+'\u65e5\u4e00\u4e8c\u4e09\u56db\u4e94\u516d'.charAt(t.getUTCDay());}
function cut(s,n){s=String(s||'');return s.length<=n?s:s.slice(0,n-1)+'\u2026';}

/* ---------- SVG：题材热度 ---------- */
function svgTheme(th,ov){
 var d=th.slice(0,15); if(!d.length)return '<div class="empty">当日无强势股题材数据</div>';
 var rowh=30,top=34,bot=16,labw=132,valw=62,barw=W-labw-valw-16;
 var h=top+rowh*d.length+bot, mx=1,i;
 for(i=0;i<d.length;i++) if(d[i].c>mx) mx=d[i].c;
 var o=['<svg viewBox="0 0 '+W+' '+h+'" class="chart" role="img" aria-label="题材热度条形图" preserveAspectRatio="xMidYMin meet">'];
 o.push('<text x="0" y="16" class="ct">当日强势股题材词频 TOP'+d.length+'</text>');
 o.push('<text x="'+W+'" y="16" class="cs" text-anchor="end">共 '+ov.thc+' 个题材 / '+ov.ti+' 个标签实例</text>');
 for(i=1;i<=mx;i++){var gx=labw+barw*i/mx;
  o.push('<line x1="'+gx.toFixed(1)+'" y1="'+(top-6)+'" x2="'+gx.toFixed(1)+'" y2="'+(h-bot+2)+'" class="grid"/>');}
 for(i=0;i<d.length;i++){var t=d[i],y=top+i*rowh,bw=Math.max(barw*t.c/mx,2),op=0.42+0.58*(t.c/mx);
  o.push('<text x="'+(labw-8)+'" y="'+(y+15)+'" class="lb" text-anchor="end">'+esc(cut(t.n,9))+'<title>'+esc(t.n)+'</title></text>');
  o.push('<rect x="'+labw+'" y="'+(y+4)+'" width="'+bw.toFixed(1)+'" height="17" rx="3" fill="var(--up)" opacity="'+op.toFixed(2)+'"/>');
  o.push('<text x="'+(labw+bw+7).toFixed(1)+'" y="'+(y+17)+'" class="vl">'+t.c+'只</text>');
  o.push('<text x="'+W+'" y="'+(y+17)+'" class="vs '+cl(t.ap)+'" text-anchor="end">'+pc(t.ap)+'</text>');}
 o.push('<line x1="'+labw+'" y1="'+(top-6)+'" x2="'+labw+'" y2="'+(h-bot+2)+'" class="axis"/></svg>');
 return o.join('');
}

/* ---------- SVG：双向发散 ---------- */
function svgDiv(items,title,sub,unit,n){
 var ups=[],dns=[],i;
 for(i=0;i<items.length;i++){if(items[i].v>0)ups.push(items[i]);else if(items[i].v<0)dns.push(items[i]);}
 ups=ups.slice(0,n);
 dns.sort(function(a,b){return a.v-b.v;}); dns=dns.slice(0,n).reverse();
 var d=ups.concat(dns);
 if(!d.length)return '<div class="empty">当日无数据</div>';
 var rowh=27,top=36,bot=18,cx=W*0.42,lab=96,maxv=1;
 for(i=0;i<d.length;i++) if(Math.abs(d[i].v)>maxv) maxv=Math.abs(d[i].v);
 var lsp=cx-lab-8, rsp=W-cx-74;
 var h=top+rowh*d.length+bot+((ups.length&&dns.length)?10:0);
 var o=['<svg viewBox="0 0 '+W+' '+h+'" class="chart" role="img" aria-label="'+esc(title)+'" preserveAspectRatio="xMidYMin meet">'];
 o.push('<text x="0" y="16" class="ct">'+esc(title)+'</text>');
 o.push('<text x="'+W+'" y="16" class="cs" text-anchor="end">'+esc(sub)+'</text>');
 var gap=0;
 for(i=0;i<d.length;i++){
  if(ups.length&&dns.length&&i===ups.length){gap=10;
   o.push('<line x1="0" y1="'+(top+i*rowh+gap-6)+'" x2="'+W+'" y2="'+(top+i*rowh+gap-6)+'" class="grid"/>');}
  var it=d[i],y=top+i*rowh+gap,up=it.v>0;
  var span=Math.max((up?rsp:lsp)*Math.abs(it.v)/maxv,1.5);
  var x0=up?cx:cx-span, color=up?'var(--up)':'var(--dn)';
  o.push('<text x="'+(cx-lab-14)+'" y="'+(y+14)+'" class="lb" text-anchor="end">'+esc(cut(it.l,7))+'<title>'+esc(it.l)+'</title></text>');
  if(it.note) o.push('<text x="'+(cx-lab-6)+'" y="'+(y+14)+'" class="vs">'+esc(it.note)+'</text>');
  o.push('<rect x="'+x0.toFixed(1)+'" y="'+(y+3)+'" width="'+span.toFixed(1)+'" height="15" rx="2.5" fill="'+color+'" opacity="0.85"/>');
  var txt=(unit==='pct')?pc(it.v):money(it.v);
  var tx=up?(cx+span+6):(cx-span-6);
  o.push('<text x="'+tx.toFixed(1)+'" y="'+(y+15)+'" class="vl '+(up?'up':'down')+'" text-anchor="'+(up?'start':'end')+'">'+txt+'</text>');}
 o.push('<line x1="'+cx+'" y1="'+(top-8)+'" x2="'+cx+'" y2="'+(h-bot+4)+'" class="axis"/></svg>');
 return o.join('');
}

/* ---------- SVG：市场宽度 ---------- */
function svgBreadth(ov){
 var up=ov.mu,dn=ov.md,fl=ov.mf,tot=up+dn+fl||1,h=86,x=0;
 var o=['<svg viewBox="0 0 '+W+' '+h+'" class="chart" role="img" aria-label="全市场涨跌分布" preserveAspectRatio="xMidYMin meet">'];
 o.push('<text x="0" y="14" class="ct">全市场涨跌分布（'+tot+' 只有效样本）</text>');
 var segs=[[up,'var(--up)','上涨'],[fl,'var(--fl)','平盘'],[dn,'var(--dn)','下跌']];
 for(var i=0;i<segs.length;i++){var bw=W*segs[i][0]/tot; if(bw<=0)continue;
  o.push('<rect x="'+x.toFixed(1)+'" y="26" width="'+bw.toFixed(1)+'" height="26" fill="'+segs[i][1]+'" opacity="0.85"/>');
  if(bw>52)o.push('<text x="'+(x+bw/2).toFixed(1)+'" y="44" class="vw" text-anchor="middle">'+segs[i][2]+' '+segs[i][0]+'</text>');
  x+=bw;}
 o.push('<text x="0" y="72" class="vs">涨停\u2248'+ov.lu+' \xb7 涨超5%：'+ov.bu+'</text>');
 o.push('<text x="'+(W/2)+'" y="72" class="vs" text-anchor="middle">涨跌比 '+(up/(dn||1)).toFixed(2)+'</text>');
 o.push('<text x="'+W+'" y="72" class="vs" text-anchor="end">跌超5%：'+ov.bd+' \xb7 跌停\u2248'+ov.ld+'</text>');
 o.push('</svg>');
 return o.join('');
}

/* ---------- SVG：近 N 日走势（可点击切日） ---------- */
function svgTrend(){
 var n=DAYS.length,h=176,top=30,bh=78,lh=44,pad=26;
 var iw=(W-pad*2)/n, mx=0.5,i,d,ov;
 for(i=0;i<n;i++){ov=P.ds[DAYS[i]].ov; mx=Math.max(mx,Math.abs(ov.net)/1e8);}
 var o=['<svg viewBox="0 0 '+W+' '+h+'" class="chart" role="img" aria-label="近期市场情绪走势" preserveAspectRatio="xMidYMin meet">'];
 o.push('<text x="0" y="14" class="ct">近 '+n+' 个交易日：龙虎榜净买入（柱）/ 全市场上涨占比（线）</text>');
 o.push('<text x="'+W+'" y="14" class="cs" text-anchor="end">点击柱体切换日期</text>');
 var zy=top+bh/2;
 o.push('<line x1="'+pad+'" y1="'+zy+'" x2="'+(W-pad)+'" y2="'+zy+'" class="axis"/>');
 var pts=[];
 for(i=0;i<n;i++){
  d=DAYS[i]; ov=P.ds[d].ov;
  var cx0=pad+iw*i, ccx=cx0+iw/2;
  if(d===cur) o.push('<rect x="'+cx0.toFixed(1)+'" y="'+(top-8)+'" width="'+iw.toFixed(1)+'" height="'+(bh+lh+16)+'" rx="4" class="selbg"/>');
  var nv=ov.net/1e8, bhh=Math.max(Math.abs(nv)/mx*(bh/2-4),1.5), bw=Math.min(iw*0.5,26);
  var by=nv>=0?zy-bhh:zy;
  o.push('<rect x="'+(ccx-bw/2).toFixed(1)+'" y="'+by.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bhh.toFixed(1)+'" rx="2" fill="'+(nv>=0?'var(--up)':'var(--dn)')+'" opacity="'+(d===cur?'1':'0.72')+'"/>');
  o.push('<text x="'+ccx.toFixed(1)+'" y="'+(nv>=0?by-4:by+bhh+11).toFixed(1)+'" class="vs '+cl(nv)+'" text-anchor="middle">'+(nv>=0?'+':'')+nv.toFixed(1)+'</text>');
  var r=ov.kv?ov.mu/ov.kv:0;
  pts.push([ccx, top+bh+lh-6-r*(lh-14)]);
  o.push('<text x="'+ccx.toFixed(1)+'" y="'+(h-13)+'" class="vs" text-anchor="middle"'+(d===cur?' style="fill:var(--acc2);font-weight:700"':'')+'>'+d.slice(5)+'</text>');
  o.push('<text x="'+ccx.toFixed(1)+'" y="'+(h-2)+'" class="vs" text-anchor="middle">'+(r*100).toFixed(0)+'%</text>');
  o.push('<rect class="hit" data-day="'+d+'" x="'+cx0.toFixed(1)+'" y="'+(top-8)+'" width="'+iw.toFixed(1)+'" height="'+(bh+lh+16)+'" rx="4"><title>'+d+' '+wd(d)+'\n龙虎榜净买入 '+money(ov.net)+'\n涨'+ov.mu+' / 跌'+ov.md+'\n最热题材 '+ov.tt+'</title></rect>');
 }
 var pd='';
 for(i=0;i<pts.length;i++) pd+=(i?'L':'M')+pts[i][0].toFixed(1)+' '+pts[i][1].toFixed(1)+' ';
 o.push('<path d="'+pd+'" fill="none" stroke="var(--acc)" stroke-width="1.8" stroke-linejoin="round"/>');
 for(i=0;i<pts.length;i++)
  o.push('<circle cx="'+pts[i][0].toFixed(1)+'" cy="'+pts[i][1].toFixed(1)+'" r="'+(DAYS[i]===cur?3.4:2.4)+'" fill="var(--acc)"/>');
 o.push('<text x="0" y="'+(h-13)+'" class="vs">亿元</text>');
 o.push('</svg>');
 return o.join('');
}

/* ---------- 表格 ---------- */
function lhbTable(rows,per){
 if(!rows.length)return '<div class="empty">当日无龙虎榜数据</div>';
 var o=['<div class="tw"><table class="tbl" id="'+(per?'tbl-stock':'tbl-row')+'">',
 '<thead><tr><th class="num">#</th><th>代码</th><th>名称</th><th class="num">收盘</th>',
 '<th class="num s" data-k="pct">涨跌幅</th><th class="num s" data-k="net">净买入</th>',
 '<th class="num">买入</th><th class="num">卖出</th>',
 '<th class="num s" data-k="to">换手率</th><th class="num">占成交</th>',
 '<th class="rs">上榜原因</th><th class="mk">板块</th></tr></thead><tbody>'];
 for(var i=0;i<rows.length;i++){var r=rows[i];
  var tag=(per&&r.nr>1)?'<span class="badge">'+r.nr+'条</span>':'';

/* ---------- 交互绑定 ---------- */
function applyFilter(inp,tbl,cnt){
 var i=document.getElementById(inp),t=document.getElementById(tbl);
 if(!i||!t)return;
 var v=q[inp]||''; i.value=v;
 var s=v.trim().toLowerCase(),n=0,rows=t.tBodies[0].rows;
 for(var k=0;k<rows.length;k++){var r=rows[k];
  var hay=((r.dataset.code||'')+' '+(r.dataset.name||'')+' '+(r.dataset.reason||'')).toLowerCase();
  var ok=!s||hay.indexOf(s)>-1; r.style.display=ok?'':'none';
  if(ok){n++;r.cells[0].textContent=n;}}
 var c=document.getElementById(cnt); if(c)c.textContent=n+' 行';
}
var FT=[['f-stock','tbl-stock','c-stock'],['f-row','tbl-row','c-row'],
        ['f-ths','tbl-ths','c-ths'],['f-ind','tbl-ind','c-ind']];
function bind(){
 for(var i=0;i<FT.length;i++){(function(f){
  var el=document.getElementById(f[0]);
  if(el){el.oninput=function(){q[f[0]]=el.value; applyFilter(f[0],f[1],f[2]);};}
  applyFilter(f[0],f[1],f[2]);
 })(FT[i]);}
}
function go(d){ if(!P.ds[d]||d===cur)return; cur=d;
 try{history.replaceState(null,'','#'+d);}catch(e){location.hash=d;}
 render(); }

document.addEventListener('click',function(e){
 var t=e.target;
 var dp=t.closest?t.closest('[data-day]'):null;
 if(dp){go(dp.getAttribute('data-day'));return;}
 if(t.id==='pv'||(t.closest&&t.closest('#pv'))){var i=DAYS.indexOf(cur);if(i>0)go(DAYS[i-1]);return;}
 if(t.id==='nx'||(t.closest&&t.closest('#nx'))){var j=DAYS.indexOf(cur);if(j<DAYS.length-1)go(DAYS[j+1]);return;}
 var tab=t.closest?t.closest('[data-tab]'):null;
 if(tab){var g=tab.getAttribute('data-g');
  var bs=document.querySelectorAll('[data-g="'+g+'"]');
  for(var k=0;k<bs.length;k++)bs[k].classList.remove('on');
  tab.classList.add('on');
  var ps=document.querySelectorAll('[data-pane="'+g+'"]');
  for(var m=0;m<ps.length;m++)
   ps[m].classList.toggle('hidden',ps[m].getAttribute('data-id')!==tab.getAttribute('data-tab'));
  return;}
 var th=t.closest?t.closest('th.s'):null;
 if(th){var tb0=th.closest('table'),key=th.dataset.k,desc=!th.classList.contains('desc');
  var hs=tb0.querySelectorAll('th.s');
  for(var a=0;a<hs.length;a++)hs[a].classList.remove('asc','desc');
  th.classList.add(desc?'desc':'asc');
  var tb=tb0.tBodies[0],rs=[].slice.call(tb.rows);
  rs.sort(function(x,y){var p=parseFloat(x.dataset[key])||0,r=parseFloat(y.dataset[key])||0;
   return desc?r-p:p-r;});
  var n=0;
  for(var b=0;b<rs.length;b++){tb.appendChild(rs[b]);
   if(rs[b].style.display!=='none'){n++;rs[b].cells[0].textContent=n;}}
  return;}
});
document.addEventListener('keydown',function(e){
 if(/^(INPUT|TEXTAREA)$/.test((e.target||{}).tagName||''))return;
 var i=DAYS.indexOf(cur);
 if(e.key==='ArrowLeft'&&i>0){go(DAYS[i-1]);e.preventDefault();}
 else if(e.key==='ArrowRight'&&i<DAYS.length-1){go(DAYS[i+1]);e.preventDefault();}
 else if(e.key==='Home'){go(DAYS[0]);}
 else if(e.key==='End'){go(P.latest);}
});
window.addEventListener('hashchange',function(){
 var d=(location.hash||'').replace(/^#/,''); if(P.ds[d])go(d);
});
