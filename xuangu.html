<title>自编公式选股</title>
<style>
:root{--ink:#2C3E50;--teal:#5F9E8F;--paper:#F7F4ED;--line:#E4DDD0;--text:#333;--dim:#8A8578;
--red:#C0392B;--green:#1E8449}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;overflow-x:hidden}
body{background:var(--paper);color:var(--text);font-size:15px;line-height:1.6;
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
-webkit-text-size-adjust:100%;padding-bottom:96px}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 0}

header{display:flex;align-items:flex-start;justify-content:space-between;padding-bottom:10px}
h1{font-size:19px;color:var(--ink);font-weight:600;letter-spacing:.3px}
h1 span{font-size:11px;color:var(--dim);font-weight:400;margin-left:7px}
.meta{font-size:12px;color:var(--dim);margin-top:5px;line-height:1.7}
.meta b{color:var(--ink);font-weight:600}
#gear{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--line);
color:var(--dim);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-top:2px}

.bar{margin:2px 0 12px}
.pb{height:3px;background:#E8E2D6;border-radius:2px;overflow:hidden}
.pb i{display:block;height:100%;width:0;background:var(--teal);transition:width .4s ease}
.msg{font-size:12px;color:var(--dim);margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg.err{color:var(--red);white-space:normal}
.hintw{font-style:normal;color:var(--red);font-weight:600}

section{margin-bottom:20px}
h2{font-size:15px;color:var(--ink);font-weight:600;border-left:3px solid var(--teal);
padding-left:9px;display:flex;align-items:center;margin-bottom:8px;line-height:1.3}
h2 em{font-style:normal;font-size:11.5px;color:var(--dim);font-weight:400;margin-left:8px}
h2 small{font-size:11px;color:#A8A092;font-weight:400;margin-left:auto}
.tb{background:#fff;border-radius:9px;box-shadow:0 1px 3px rgba(44,62,80,.06);overflow:hidden}
.item{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-top:1px solid var(--line)}
.item:first-child{border-top:none}
.l{flex:1 1 auto;min-width:0;padding-right:10px}
a.l,a.q{display:block;text-decoration:none;color:inherit;-webkit-tap-highlight-color:transparent}
a.l:active,a.q:active{opacity:.6}
.jal{font-style:normal;color:#C3BBAE;font-size:12px;margin-left:3px;vertical-align:1px}
.nm{font-size:14.5px;color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:11.5px;color:var(--dim);margin-top:3px;font-variant-numeric:tabular-nums;
overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chg{flex:0 0 auto;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.up{color:var(--red)}.down{color:var(--green)}.flat{color:#666}
.st{display:inline-block;font-style:normal;font-size:9.5px;line-height:1.4;color:#fff;
background:#B0846A;border-radius:3px;padding:0 3px;margin-left:4px;vertical-align:1.5px}
.multi{font-size:10px;color:var(--teal);border:1px solid #CBDCD7;border-radius:3px;
padding:0 3px;margin-left:4px;vertical-align:1.5px;white-space:nowrap}

.empty{background:#fff;border-radius:9px;padding:30px 18px;text-align:center;color:var(--dim);
font-size:13px;box-shadow:0 1px 3px rgba(44,62,80,.06);line-height:1.75}
.empty b{display:block;color:var(--ink);font-size:15px;font-weight:600;margin-bottom:6px}

.hist{margin:2px 0 8px}
.hist .t{font-size:11.5px;color:var(--dim);margin-bottom:7px}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:12px;color:var(--ink);background:#fff;border:1px solid var(--line);
border-radius:14px;padding:4px 11px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip u{text-decoration:none;color:var(--dim);margin-left:4px;font-size:11px}
.chip.on u{color:rgba(255,255,255,.7)}

/* 回测 */
.btop{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.back{background:#fff;border:1px solid var(--line);color:var(--ink);font-size:12.5px;
padding:6px 12px;border-radius:8px;font-weight:500}
.btt{font-size:12px;color:var(--dim)}
.bench{background:#fff;border-radius:9px;padding:11px 13px;font-size:12.5px;color:var(--dim);
margin-bottom:14px;box-shadow:0 1px 3px rgba(44,62,80,.06);line-height:1.9}
.bench b{font-weight:600;font-variant-numeric:tabular-nums}
.kbox{background:#fff;border-radius:9px;box-shadow:0 1px 3px rgba(44,62,80,.06);
display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.kbox.dim{padding:22px;text-align:center;font-size:13px;color:var(--dim);display:block}
.k{padding:11px 13px;border-top:1px solid var(--line);border-right:1px solid var(--line)}
.k:nth-child(1),.k:nth-child(2){border-top:none}
.k:nth-child(2n){border-right:none}
.k span{display:block;font-size:11.5px;color:var(--dim)}
.k b{display:block;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.note{font-size:11.5px;color:#A8A092;line-height:1.9;margin:3px 0 6px}
.note>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:4px;
color:#A8A092;font-size:11.5px;padding:3px 0;-webkit-tap-highlight-color:transparent}
.note>summary::-webkit-details-marker{display:none}
.note>summary::after{content:'▾';font-size:9px;line-height:1;transform:translateY(1px)}
.note[open]>summary::after{content:'▴'}
.note[open]>summary{margin-bottom:2px}

/* 入选汇总 */
.smeta{font-size:12.5px;color:var(--dim);margin:-2px 0 3px}
.smeta b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.sorts{font-size:11.5px;color:#A8A092;margin-bottom:5px}
.sorts b{color:var(--teal);font-weight:600}
.tw{overflow:auto;overscroll-behavior-x:contain;background:#fff;border-radius:9px;
box-shadow:0 1px 3px rgba(44,62,80,.07);margin-bottom:12px}
.tw table{border-collapse:collapse;table-layout:fixed;width:496px}
.tw th{background:#EDE8DD;color:var(--ink);font-size:11px;font-weight:600;padding:9px 4px;
text-align:right;white-space:nowrap;cursor:pointer;user-select:none;-webkit-user-select:none;
position:sticky;top:0;z-index:2;box-shadow:inset 0 -1px 0 #D8D0BE}
.tw th:first-child{text-align:left;left:0;z-index:3;
box-shadow:inset 0 -1px 0 #D8D0BE,3px 0 5px -2px rgba(44,62,80,.10)}
.tw th.on{color:var(--teal);background:#E4DDCC}
.tw th.on:first-child{background:#E4DDCC}
.tw th u{text-decoration:none;font-size:9.5px;margin-left:1px}
.tw td{padding:8px 4px;border-top:1px solid var(--line);font-size:11.5px;text-align:right;
white-space:nowrap;font-variant-numeric:tabular-nums}
.tw td.nm{position:sticky;left:0;z-index:1;background:#fff;
border-right:1px solid var(--line);box-shadow:3px 0 5px -2px rgba(44,62,80,.16)}
.tw th.sep{border-right:1px solid #DBD4C4;
box-shadow:inset 0 -1px 0 #D8D0BE,3px 0 5px -2px rgba(44,62,80,.10)}
.tw td.nm{text-align:left;line-height:1.32}
.tw td.nm a.q b{font-weight:500;color:var(--ink);font-size:12.5px}
.tw td.nm a.q i{font-style:normal;display:block;font-size:9.5px;color:#9A9385;
font-family:ui-monospace,Menlo,monospace}
.tw td.nm s{text-decoration:none;display:block;font-size:9.5px;color:var(--teal);margin-top:1px}
.tw td.dt{color:#6B7280;font-size:11px}
.tw td.up{color:var(--red)}
.tw td.down{color:var(--green)}

/* 数据面板 */
.panel{z-index:55;display:none;background:#fff;border-radius:9px;padding:15px;margin-bottom:16px;
box-shadow:0 1px 3px rgba(44,62,80,.06)}
.panel.on{display:block}
.panel .pt{font-size:13px;color:var(--dim);line-height:2;margin-bottom:12px}
.panel .pt b{color:var(--ink);font-weight:600}
.panel .prow{display:flex;gap:9px}
.panel .prow button{font-size:12.5px;padding:9px 0}
.panel button{flex:1;font-size:13px;padding:10px 0;border-radius:8px;border:1px solid var(--line);
background:#FAF8F3;color:var(--ink);font-weight:500}
.panel button.warn{color:#A33;border-color:#E8CBCB;background:#FDF7F7}
.panel .plabel{font-size:11.5px;color:var(--dim);margin:13px 0 6px}
.panel .qsrc button{font-size:12.5px;padding:9px 0}

<script>
/* 策略引擎 · 通达信公式的 JS 实现
 * 与 Python 版 engine.py 逐条对应，返回全序列信号（0/1）
 */
(function (root) {
  'use strict';
  var NAN = NaN;

  function FA(n, v) { var a = new Float64Array(n); if (v !== undefined) a.fill(v); return a; }
  function BA(n) { return new Uint8Array(n); }

  /* ---------- 通达信函数 ---------- */
  function REF(a, k) {
    var n = a.length, o = FA(n, NAN);
    if (k <= 0) { o.set(a); return o; }
    for (var i = k; i < n; i++) o[i] = a[i - k];
    return o;
  }

  function MA(a, n) {
    var len = a.length, o = FA(len, NAN), s = 0;
    for (var i = 0; i < len; i++) {
      var x = a[i]; if (x !== x) x = 0;
      s += x;
      if (i >= n) { var y = a[i - n]; if (y !== y) y = 0; s -= y; }
      if (i >= n - 1) o[i] = s / n;
    }
    return o;
  }

  function EMA(a, n) {
    var len = a.length, o = FA(len, NAN), k = 2 / (n + 1), prev = NAN;
    for (var i = 0; i < len; i++) {
      var x = a[i];
      if (x !== x) { o[i] = prev; continue; }
      prev = (prev !== prev) ? x : x * k + prev * (1 - k);
      o[i] = prev;
    }
    return o;
  }

  function HHV(a, n) {
    var len = a.length, o = FA(len, NAN);
    for (var i = 0; i < len; i++) {
      var st = Math.max(0, i - n + 1), m = -Infinity;
      for (var j = st; j <= i; j++) if (a[j] > m) m = a[j];
      o[i] = m === -Infinity ? NAN : m;
    }
    return o;
  }

  function LLV(a, n) {
    var len = a.length, o = FA(len, NAN);
    for (var i = 0; i < len; i++) {
      var st = Math.max(0, i - n + 1), m = Infinity;
      for (var j = st; j <= i; j++) if (a[j] < m) m = a[j];
      o[i] = m === Infinity ? NAN : m;
    }
    return o;
  }

  function COUNT(b, n) {
    var len = b.length, o = FA(len), s = 0;
    for (var i = 0; i < len; i++) {
      s += b[i] ? 1 : 0;
      if (i >= n) s -= b[i - n] ? 1 : 0;
      o[i] = s;
    }
    return o;
  }

  function COUNT_DYN(b, ns) {
    var len = b.length, o = FA(len), pre = FA(len + 1), s = 0;
    pre[0] = 0;
    for (var i = 0; i < len; i++) { s += b[i] ? 1 : 0; pre[i + 1] = s; }
    for (var k = 0; k < len; k++) {
      var n = ns[k]; if (n !== n) n = 0;
      var left = Math.max(0, Math.floor(k + 1 - n));
      o[k] = pre[k + 1] - pre[left];
    }
    return o;
  }

  function EVERY(b, n) { return COUNT(b, n).map(function (x) { return x >= n ? 1 : 0; }); }
  function EVERY_DYN(b, ns) {
    var cd = COUNT_DYN(b, ns), o = BA(b.length);
    for (var i = 0; i < b.length; i++) o[i] = (cd[i] >= ns[i] && ns[i] > 0) ? 1 : 0;
    return o;
  }

  function BARSLAST(b) {
    var len = b.length, o = FA(len), last = -1;
    for (var i = 0; i < len; i++) {
      if (b[i]) last = i;
      o[i] = last >= 0 ? i - last : 0;
    }
    return o;
  }

  function BARSLASTCOUNT(b) {
    var len = b.length, o = FA(len), c = 0;
    for (var i = 0; i < len; i++) { c = b[i] ? c + 1 : 0; o[i] = c; }
    return o;
  }

  function REF_DYN(a, ks) {
    var len = a.length, o = FA(len, NAN);
    for (var i = 0; i < len; i++) {
      var k = ks[i]; if (k !== k) k = 0;
      var j = i - k;
      if (j >= 0) o[i] = a[j | 0];
    }
    return o;
  }

  function r2(x) { return Math.floor(x * 100 + 0.5) / 100; }
  function C1(n, v) { var a = BA(n); if (v) a.fill(1); return a; }

  /* ---------- 工具 ---------- */
  function band(a, b, f) {           // 两个数组/标量逐元素
    var n = a.length, o = BA(n);
    if (typeof b === 'number') { for (var i = 0; i < n; i++) o[i] = f(a[i], b) ? 1 : 0; return o; }
    for (var j = 0; j < n; j++) o[j] = f(a[j], b[j]) ? 1 : 0;
    return o;
  }
  function and() {
    var n = arguments[0].length, o = BA(n);
    for (var i = 0; i < n; i++) { var v = 1; for (var k = 0; k < arguments.length; k++) if (!arguments[k][i]) { v = 0; break; } o[i] = v; }
    return o;
  }
  function or() {
    var n = arguments[0].length, o = BA(n);
    for (var i = 0; i < n; i++) { var v = 0; for (var k = 0; k < arguments.length; k++) if (arguments[k][i]) { v = 1; break; } o[i] = v; }
    return o;
  }
  function not(a) { var n = a.length, o = BA(n); for (var i = 0; i < n; i++) o[i] = a[i] ? 0 : 1; return o; }
  function gt(a, b) { return typeof b === 'number' ? band(a, b, function (x, y) { return x > y; }) : band(a, b, function (x, y) { return x > y; }); }
  function ge(a, b) { return band(a, b, function (x, y) { return x >= y; }); }
  function lt(a, b) { return band(a, b, function (x, y) { return x < y; }); }
  function le(a, b) { return band(a, b, function (x, y) { return x <= y; }); }
  function eq(a, b) { return band(a, b, function (x, y) { return Math.abs(x - y) < 1e-9; }); }
  function add(a, b) { return arith(a, b, function (x, y) { return x + y; }); }
  function sub(a, b) { return arith(a, b, function (x, y) { return x - y; }); }
  function mul(a, b) { return arith(a, b, function (x, y) { return x * y; }); }
  function div(a, b) { return arith(a, b, function (x, y) { return y === 0 ? NAN : x / y; }); }
  function arith(a, b, f) {
    var n = a.length, o = FA(n);
    if (typeof b === 'number') { for (var i = 0; i < n; i++) o[i] = f(a[i], b); return o; }
    for (var j = 0; j < n; j++) o[j] = f(a[j], b[j]);
    return o;
  }
  function maxAB(a, b) { return arith(a, b, function (x, y) { return x > y ? x : y; }); }
  function minAB(a, b) { return arith(a, b, function (x, y) { return x < y ? x : y; }); }
  function absA(a) { var o = FA(a.length); for (var i = 0; i < a.length; i++) o[i] = Math.abs(a[i]); return o; }
  function whereB(cond, x, y) {
    var n = cond.length, o = FA(n);
    for (var i = 0; i < n; i++) o[i] = cond[i] ? x : y;
    return o;
  }
  function whereA(cond, x, y) {   // x/y 为数组
    var n = cond.length, o = FA(n);
    for (var i = 0; i < n; i++) o[i] = cond[i] ? x[i] : y[i];
    return o;
  }
  function last(a) { return a.length ? a[a.length - 1] : NAN; }

  /* ---------- 主评估 ---------- */
  function evaluate(o, h, l, c, v, code, name, pe, fwan, nmc) {
    var n = c.length;
    var empty = { '高量Q': BA(n), '燕双飞': BA(n), '夜': BA(n), '仓鼠量化': BA(n), 'ZTDX': BA(n), '攻防': BA(n) };
    if (n < 130) return empty;

    var pre2 = code.slice(0, 2);
    var only = (pre2 === '60' || pre2 === '00' || pre2 === '30');
    if (!only) return empty;

    var upName = String(name).toUpperCase();
    var is_st = upName.indexOf('ST') >= 0;
    var qst = !is_st;
    var SH = (pre2 === '00' || pre2 === '60');
    var SZ20 = (pre2 === '30');
    var pre3 = code.slice(0, 3);
    var SH_MAIN = ['600', '601', '603', '605', '000', '001', '002', '003'].indexOf(pre3) >= 0;
    var CYB = (pre3 === '300' || pre3 === '301');
    var KCB = (pre3 === '688');

    var prev = REF(c, 1);
    var lim = SH ? 0.10 : (SZ20 ? 0.20 : 0.30);
    var ztp = FA(n), dtp = FA(n);
    for (var i = 0; i < n; i++) {
      var p = prev[i];
      ztp[i] = p === p ? r2(p * (1 + lim)) : NAN;
      dtp[i] = p === p ? r2(p * (1 - lim)) : NAN;
    }
    var ZT = BA(n), DT = BA(n), ZB = BA(n);
    for (var i2 = 0; i2 < n; i2++) {
      ZT[i2] = (c[i2] === h[i2]) && (c[i2] >= ztp[i2]) ? 1 : 0;
      DT[i2] = (c[i2] === l[i2]) && (c[i2] <= dtp[i2]) ? 1 : 0;
      ZB[i2] = (c[i2] < h[i2]) && (h[i2] >= ztp[i2]) ? 1 : 0;
    }
    var SB = and(ZT, eq(COUNT(ZT, 10), 1));
    var LBTS = BARSLASTCOUNT(ZT);

    var SYX = FA(n), ST_K = FA(n), XYX = FA(n), JZF = FA(n), ZF = FA(n);
    for (var i3 = 0; i3 < n; i3++) {
      var pv = prev[i3];
      SYX[i3] = 100 * (h[i3] - Math.max(c[i3], o[i3])) / pv;
      ST_K[i3] = 100 * Math.abs(c[i3] - o[i3]) / pv;
      XYX[i3] = 100 * (Math.min(c[i3], o[i3]) - l[i3]) / pv;
      JZF[i3] = 100 * (o[i3] - pv) / pv;
      ZF[i3] = 100 * (c[i3] - pv) / pv;
    }

    var MA5 = MA(c, 5), MA20 = MA(c, 20), MA60 = MA(c, 60), MA120 = MA(c, 120);
    var MA18 = MA(c, 18);
    var MA60_UP = gt(MA60, REF(MA60, 1));
    var MA120_UP = gt(MA120, REF(MA120, 1));
    var V_MA5 = MA(v, 5), V_MA10 = MA(v, 10), V_LLV16 = LLV(v, 16);

    /* 啦啦指标 */
    var base = FA(n);
    for (var i4 = 0; i4 < n; i4++) base[i4] = ((c[i4] + l[i4]) + o[i4] * 3 + h[i4]);
    var x32 = div(REF(base, 1), 6);
    var x33 = mul(x32, 20);
    for (var k1 = 1; k1 < 10; k1++) { var t1 = mul(REF(x32, k1), 20 - k1); for (var m1 = 0; m1 < n; m1++) x33[m1] += t1[m1]; }
    var x34 = FA(n, 0);
    for (var k2 = 10; k2 < 20; k2++) { var t2 = mul(REF(x32, k2), 20 - k2); for (var m2 = 0; m2 < n; m2++) x34[m2] += t2[m2]; }
    var x35 = div(add(x33, x34), 210);
    var x36 = MA(x35, 6);
    var x37 = mul(sub(x35, x36), 1.2);
    var hl = add(h, l);
    var x38 = mul(div(add(mul(o, 2), REF(hl, 1)), 4), 10);
    var e6 = EMA(x38, 6), e55 = EMA(x38, 55);
    var x39 = sub(e6, e55);
    var x40 = EMA(x39, 6);
    var x41 = mul(sub(x39, x40), 0.06);
    var LALA = gt(add(x37, x41), 0);

    var cr = div(c, REF(c, 1));
    var SHM = C1(n, SH_MAIN), CYBB = C1(n, CYB), SZ20A = C1(n, SZ20), SHA = C1(n, SH);
    var exMainZT = not(and(SHM, ge(cr, 1.095), eq(c, h)));
    var exCybZT = not(and(CYBB, ge(cr, 1.19), eq(c, h)));

    var fin_ok = (pe === pe) && pe > 0;
    var nmc_yi = (nmc === nmc) ? nmc / 10000 : NAN;
    var big_float = (nmc_yi === nmc_yi) && nmc_yi > 30;

    /* ---------- 高量Q ---------- */
    var c1 = le(v, mul(V_MA5, 1.2));
    var condA = or(gt(REF(c1, 1), 0.5), gt(REF(c1, 2), 0.5), le(REF(v, 1), mul(REF(v, 2), 1.2)));
    var condB = le(REF(c, 1), mul(REF(c, 2), 0.91));
    var condC = lt(absA(sub(REF(c, 1), REF(l, 1))), 1e-9);
    var up = gt(c, REF(c, 1));
    var bl = BARSLAST(up);
    var iDyn = FA(n);
    var blRef = REF(bl, 1);
    for (var i6 = 0; i6 < n; i6++) iDyn[i6] = (bl[i6] === 0) ? (blRef[i6] + 1) : bl[i6];
    var condD = le(l, mul(REF_DYN(c, iDyn), 0.815));
    var vEqHHV5 = lt(absA(sub(v, HHV(v, 5))), 1e-9);
    var rng5 = ge(mul(div(sub(h, l), REF(c, 1)), 100), 5);
    var gaoliang = and(condA, condB, condC, condD, gt(c, o), vEqHHV5, ge(v, mul(REF(v, 1), 2)), rng5);
    if (is_st) { for (var i7 = 0; i7 < n; i7++) gaoliang[i7] = 0; }
    var glC = BARSLAST(gaoliang);
    var refPx = REF_DYN(c, glC);
    var sig = and(gt(c, refPx), lt(glC, 5), gt(c, o));
    var cdc = COUNT_DYN(sig, glC);
    var glQ = and(sig, eq(cdc, 1), exMainZT, exCybZT);
    if (!only) glQ.fill(0);

    /* ---------- 燕双飞 ---------- */
    var T2_20 = REF(HHV(h, 20), 1);
    var T3 = REF(LLV(l, 10), 1);
    var T4 = gt(l, T3);
    var T5 = lt(h, T2_20);
    var T6 = n > 30;
    var T7 = FA(n);
    var pc1 = REF(c, 1);
    for (var i8 = 0; i8 < n; i8++) {
      T7[i8] = Math.max(Math.max(h[i8] - l[i8], Math.abs(pc1[i8] - h[i8])), Math.abs(pc1[i8] - l[i8]));
    }
    var T8 = MA(T7, 14);
    var T9 = div(add(h, l), 2);
    var T10 = MA(T7, 2);
    var T11 = add(T9, T10);
    var T12 = sub(T9, T10);
    var T13 = lt(c, HHV(T12, 3));
    var T14 = and(lt(c, REF(c, 1)), lt(c, o), gt(absA(sub(c, l)), 1e-9), gt(c, MA18));
    var T15 = gt(MA20, REF(MA20, 1));
    var T16 = lt(c, REF(LLV(l, 3), 1));
    var T17 = and(gt(T8, REF(T8, 1)), gt(T7, REF(T7, 1)));
    var T18 = div(sub(c, l), sub(h, l));
    var T19 = lt(T18, 0.3);
    var SYa = FA(n), ST1 = FA(n);
    for (var i9 = 0; i9 < n; i9++) {
      SYa[i9] = c[i9] > o[i9] ? (h[i9] - c[i9]) : (h[i9] - o[i9]);
      ST1[i9] = Math.abs(c[i9] - o[i9]);
    }
    var X1 = div(add(add(c, h), o), 3);
    var X2 = EMA(X1, 112);
    var YX = mul(div(sub(c, X2), c), 100);
    var VOL1 = lt(v, mul(V_MA5, 0.95));
    var syOk = lt(SYa, mul(ST1, 1.5));
    var c60 = lt(c, 60);
    var zfOk = and(gt(ZF, -6), lt(ZF, 3));
    var yinPrev = lt(REF(c, 1), REF(o, 1));
    var filt = fin_ok && big_float;
    var ysf = and(T14, gt(YX, 7), T15, T16, T17, T19, T13, T4, T5, syOk, LALA, c60, zfOk, yinPrev, VOL1);
    if (!filt || !qst) ysf.fill(0);

    /* ---------- 夜 ---------- */
    var attack = EMA(c, 5);
    var HSL = FA(n);
    for (var i10 = 0; i10 < n; i10++) HSL[i10] = (fwan && fwan > 0) ? v[i10] / fwan : 0;
    var z1 = and(gt(cr, 1.093), eq(c, h));
    var z2 = and(gt(cr, 1.193), eq(c, h));
    var ZT_N = (CYB || KCB) ? z2 : z1;
    var hlPrev = lt(h, REF(l, 1));
    var QK1 = eq(COUNT(hlPrev, 5), 0);
    var QK2 = not(and(gt(c, REF(c, 1)), gt(h, REF(h, 1))));
    var QK = and(QK1, QK2);
    var minCO = minAB(c, o);
    var redSmall = ge(mul(div(absA(sub(c, o)), minCO), 100), 2);
    var co = sub(c, o), hc = sub(h, c), ol = sub(o, l);
    var mini = and(
      gt(c, o),
      gt(div(h, REF(c, 1)), 1.005),
      gt(co, hc), gt(co, ol),
      lt(div(h, l), 1.12),
      gt(div(h, o), 1.036)
    );
    var mini2 = gt(REF(and(lt(c, o), ge(div(h, c), 1.02)), 1), 0.5);
    var mini3 = gt(REF(and(gt(c, o), gt(h, REF(c, 1))), 2), 0.5);
    var mini4 = le(REF(div(h, o), 3), 1.053);
    var mini5 = le(v, REF(v, 2));
    var mini6 = lt(v, V_MA10);
    var mini7 = le(v, mul(REF(LLV(v, 20), 1), 3.5));
    var redPrev = gt(REF(redSmall, 1), 0.5);
    var night = and(MA120_UP, exMainZT, exCybZT, mini, mini2, mini3, mini4, mini5, mini6, mini7,
      gt(h, attack), gt(HSL, 3), not(ZT_N), redPrev, QK);
    night = and(night, LALA);
    if (!big_float || !qst) night.fill(0);
    if (root.TDXEngine && root.TDXEngine._dbg) {
      root.TDXEngine._mid = { MA120_UP: MA120_UP, exMainZT: exMainZT, exCybZT: exCybZT, mini: mini, mini2: mini2,
        mini3: mini3, mini4: mini4, mini5: mini5, mini6: mini6, mini7: mini7,
        atk: gt(h, attack), hsl: gt(HSL, 3), nzt: not(ZT_N), red: gt(REF(redSmall, 1), 0.5), QK: QK, LALA: LALA };
    }

    /* ---------- 仓鼠量化 ---------- */
    var G2 = gt(o, c);
    var G3 = ge(div(REF(c, 1), c), 1.03);
    var G4 = lt(div(c, l), 1.03);
    var G5 = and(lt(v, mul(REF(v, 3), 1.2)), gt(v, mul(REF(v, 3), 0.9)));
    var G6 = lt(h, REF(h, 1));
    var G7 = gt(EMA(c, 5), mul(MA(c, 14), 1.017));
    var G8 = and(lt(REF(o, 3), REF(c, 3)), lt(REF(o, 2), REF(c, 2)), gt(REF(o, 1), REF(c, 1)));
    var G9 = lt(REF(c, 2), mul(REF(c, 1), 1.01));
    var G10 = lt(v, mul(V_LLV16, 9.5));
    var G11 = lt(sub(c, l), mul(sub(o, c), 0.6));
    var G12 = lt(div(REF(c, 1), REF(c, 2)), 1.0995);
    var G13 = lt(div(REF(h, 1), c), 1.07);

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function pool(items, worker, concurrency, onTick, onErr) {
    var i = 0, done = 0, total = items.length;
    function run() {
      return new Promise(function (resolve) {
        function step() {
          if (i >= total) return resolve();
          var k = i++;
          worker(items[k], k).catch(function (e) { if (onErr) onErr(e, items[k]); }).then(function () {
            done++;
            if (onTick && done % 10 === 0) onTick(done, total);
            step();
          });
        }
        step();
      });
    }
    var arr = [];
    for (var c = 0; c < concurrency; c++) arr.push(run());
    return Promise.all(arr).then(function () { if (onTick) onTick(total, total); });
  }

  /* 失败才重试（旧版是「连续跑 times 次」，成功也重复请求，等于把流量放大 3 倍，
     批量拉列表时极易触发接口限流）。 */
  function retry(fn, times) {
    times = times || 3;
    function attempt(left) {
      return fn().catch(function (e) {
        if (left <= 1) throw e;
        return sleep(300 * (times - left + 1)).then(function () { return attempt(left - 1); });
      });
    }
    return attempt(times);
  }

  /* ---------- IndexedDB ---------- */
  var _db = null;
  function db() {
    if (_db) return _db;
    _db = new Promise(function (res, rej) {
      var q = indexedDB.open(DB_NAME, DB_VER);
      q.onupgradeneeded = function () {
        var d = q.result;
        if (!d.objectStoreNames.contains('k')) d.createObjectStore('k');
        if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta');
      };
      q.onsuccess = function () { res(q.result); };
      q.onerror = function () { rej(q.error); };
    });
    return _db;
  }

  function putKlines(entries) {
    return db().then(function (d) {
      return new Promise(function (res, rej) {
        var tx = d.transaction('k', 'readwrite'), os = tx.objectStore('k');
        entries.forEach(function (e) { os.put(e.v, e.code); });
        tx.oncomplete = function () { res(); };
        tx.onerror = function () { rej(tx.error); };
      });
    });
  }

  function loadAllKlines() {
    return db().then(function (d) {
      return new Promise(function (res, rej) {
        var tx = d.transaction('k', 'readonly'), os = tx.objectStore('k');
        var kq = os.getAllKeys(), vq = os.getAll();
        tx.oncomplete = function () {
          var m = new Map();
          for (var i = 0; i < kq.result.length; i++) m.set(kq.result[i], vq.result[i]);
          res(m);
        };
        tx.onerror = function () { rej(tx.error); };
      });
    });
  }

  function getMeta() {
    return db().then(function (d) {
      return new Promise(function (res) {
        var tx = d.transaction('meta', 'readonly');
        var q = tx.objectStore('meta').get('info');
        tx.oncomplete = function () { res(q.result || null); };
        tx.onerror = function () { res(null); };
      });
    });
  }

  function putMeta(v) {
    return db().then(function (d) {
      return new Promise(function (res) {
        var tx = d.transaction('meta', 'readwrite');
        tx.objectStore('meta').put(v, 'info');
        tx.oncomplete = function () { res(); };
      });
    });
  }

  function todayStr() {
    var d = new Date(), p = function (x) { return (x < 10 ? '0' : '') + x; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  /* ---------- 日期序列（随日线一起存本地） ----------
     每根K线存一个 Int16（2020-01-01 起的天数），210 根约 420 字节。
     「入选汇总」要在本地把「倒数第几根K线」映射回真实交易日，
     以前是逐只再拉一次日线接口，几百只就是几百次全量请求。 */
  var DATE_BASE = Date.UTC(2020, 0, 1);
  function dayNum(s) {
    if (!s || s.length < 10) return 0;
    return Math.round((Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) - DATE_BASE) / 86400000);
  }
  function dayStr(v) {
    var d = new Date(DATE_BASE + v * 86400000), p = function (x) { return (x < 10 ? '0' : '') + x; };
    return d.getUTCFullYear() + '-' + p(d.getUTCMonth() + 1) + '-' + p(d.getUTCDate());
  }

  /* 判断某根缓存K线是否就是快照这一天的数据（价格差 < 0.011 元、量差 < 0.2%） */
  function barIsSnapshot(k, i, s) {
    return Math.abs(k.o[i] / 1000 - s.open) < 0.011 && Math.abs(k.h[i] / 1000 - s.high) < 0.011 &&
      Math.abs(k.l[i] / 1000 - s.low) < 0.011 && Math.abs(k.c[i] / 1000 - s.close) < 0.011 &&
      Math.abs(k.v[i] - s.vol) <= Math.max(1, s.vol * 0.002);
  }

  /* 快照接口挂掉时的降级方案：用本地日线的最后一根拼出「伪快照」，
     让选股/回测/汇总照常跑。名称、PE、流通市值沿用上次成功刷新时存下的
     静态数据（S.meta.stocks），涨跌幅由最后两根收盘价算出。
     缺的只是「今天」这一天的实时价，所以结果等于「用上一交易日收盘重算」。 */
  function localSnap(K, stk) {
    var out = [];
    K.forEach(function (k, code) {
      if (!k || k.n < 2) return;
      var close = k.c[k.n - 1] / 1000, prev = k.c[k.n - 2] / 1000;
      if (!(close > 0) || !(prev > 0)) return;
      var meta = stk && stk[code];
      var bd = k.bd || (k.dd && k.dd.length === k.n && k.dd[k.n - 1] ? dayStr(k.dd[k.n - 1]) : '');
      out.push({
        code: code, name: (meta && meta[0]) || code,
        open: k.o[k.n - 1] / 1000, high: k.h[k.n - 1] / 1000, low: k.l[k.n - 1] / 1000,
        close: close, prev: prev, vol: k.v[k.n - 1],
        turnover: 0, pe: (meta && meta[2]) || 0, nmc: (meta && meta[1]) || 0,
        time: '', barDate: bd, local: 1
      });
    });
    return out;
  }

  /* 本地缓存里最新的那根K线日期（快照拿不到时用它代替「最新交易日」） */
  function localLatestDate(K) {
    var m = '';
    if (K) K.forEach(function (k) { if (k.bd && k.bd > m) m = k.bd; });
    return m;
  }

  /* 用当日快照写入「今日」K线：缓存里已有今日则覆盖为最新，没有则追加。
     盘中反复刷新即可持续更新，收盘后再次刷新会被收盘数据覆盖。
     判定同时看日期和数据本身：多标签页/旧版本并发写入可能把同一天写成两遍，
     重复的那根会让量能参照整体错位（选股结果随之错），所以先做去重修复。 */
  function applyTodayBars(snap, K) {
    var entries = [], added = 0, updated = 0, fixed = 0, noop = 0;
    snap.forEach(function (s) {
      var k = K.get(s.code);
      if (!k || !(s.close > 0) || !(s.vol > 0) || !s.barDate || k.n < 1) return;
      var n = k.n, same, dirty = false;
      // 最后两根都与今日快照完全一致 → 同一天被写了两遍，删掉多出来的那根
      if (n >= 2 && barIsSnapshot(k, n - 1, s) && barIsSnapshot(k, n - 2, s)) {
        k.o = k.o.slice(0, n - 1); k.h = k.h.slice(0, n - 1); k.l = k.l.slice(0, n - 1);
        k.c = k.c.slice(0, n - 1); k.v = k.v.slice(0, n - 1);
        if (k.dd && k.dd.length === n) k.dd = k.dd.slice(0, n - 1);
        n = n - 1; k.n = n; fixed++; dirty = true;
      }
      if (k.cl) same = false;                        // 今日已被清空：必须重新追加
      else if (k.bd) same = (k.bd === s.barDate) || barIsSnapshot(k, n - 1, s);
      else same = barIsSnapshot(k, n - 1, s);        // 无日期：数据完全一致即同一根
      if (same) {
        var o2 = Math.round(s.open * 1000), h2 = Math.round(s.high * 1000),
          l2 = Math.round(s.low * 1000), c2 = Math.round(s.close * 1000), v2 = Math.round(s.vol),
          d2 = s.barDate ? dayNum(s.barDate) : 0;
        // 数值与日期都与缓存完全一致 → 这条记录没必要重写。
        // 收盘后再刷新、或盘中连点两次「刷新选股」，全市场 4600 条几乎都不变，
        // 以前一律 put 一遍，手机端的写放大全耗在这上面。
        if (k.o[n - 1] !== o2 || k.h[n - 1] !== h2 || k.l[n - 1] !== l2 || k.c[n - 1] !== c2 ||
          k.v[n - 1] !== v2 || k.bd !== s.barDate ||
          (k.dd && k.dd.length >= n && d2 && k.dd[n - 1] !== d2)) dirty = true;
        if (dirty) {
          k.o[n - 1] = o2;
          k.h[n - 1] = h2;
          k.l[n - 1] = l2;
          k.c[n - 1] = c2;
          k.v[n - 1] = v2;
          if (k.dd && k.dd.length >= n && s.barDate) k.dd[n - 1] = d2;
          k.bd = s.barDate;
          updated++;
        } else {
          noop++;
        }
      } else {
        var o = new Int32Array(n + 1), h = new Int32Array(n + 1), l = new Int32Array(n + 1),
          c = new Int32Array(n + 1), v = new Int32Array(n + 1);
        o.set(k.o); h.set(k.h); l.set(k.l); c.set(k.c); v.set(k.v);
        o[n] = Math.round(s.open * 1000); h[n] = Math.round(s.high * 1000);
        l[n] = Math.round(s.low * 1000); c[n] = Math.round(s.close * 1000);
        v[n] = Math.round(s.vol);
        if (k.dd && k.dd.length === n) {
          var dd2 = new Int16Array(n + 1);
          dd2.set(k.dd);
          dd2[n] = dayNum(s.barDate);
          k.dd = dd2;
        }
        k.o = o; k.h = h; k.l = l; k.c = c; k.v = v; k.n = n + 1; k.bd = s.barDate;
        k.cl = 0;
        added++; dirty = true;
      }
      if (dirty) entries.push({ code: s.code, v: k });
    });
    if (!entries.length) return Promise.resolve({ added: 0, updated: 0, fixed: 0, noop: noop });
    return putKlines(entries).then(function () {
      return { added: added, updated: updated, fixed: fixed, noop: noop };
    });
  }

  /* 清掉缓存里的「今日」那根 K线（剔除盘中过程数据） */
  function clearTodayBars(K) {
    var t = todayStr(), entries = [], cnt = 0;
    K.forEach(function (k, code) {
      if (k.bd === t && k.n > 1) {
        var n0 = k.n, cut = n0 - 1;
        // 若最后两根完全相同且量非零，说明今天被写了两遍，一起清掉
        if (n0 >= 3 && k.v[n0 - 1] > 0 &&
          k.o[n0 - 1] === k.o[n0 - 2] && k.h[n0 - 1] === k.h[n0 - 2] && k.l[n0 - 1] === k.l[n0 - 2] &&
          k.c[n0 - 1] === k.c[n0 - 2] && k.v[n0 - 1] === k.v[n0 - 2]) cut = n0 - 2;
        if (cut < 1) return;
        k.o = k.o.slice(0, cut); k.h = k.h.slice(0, cut); k.l = k.l.slice(0, cut);
        k.c = k.c.slice(0, cut); k.v = k.v.slice(0, cut);
        if (k.dd && k.dd.length === n0) k.dd = k.dd.slice(0, cut);
        k.n = cut; k.bd = ''; k.cl = 1;
        entries.push({ code: code, v: k });
        cnt++;
      }
    });
    if (!entries.length) return Promise.resolve(0);
    return putKlines(entries).then(function () { return cnt; });
  }

  function clearAll() {
    return db().then(function (d) {
      return new Promise(function (res) {
        var tx = d.transaction(['k', 'meta'], 'readwrite');
        tx.objectStore('k').clear();
        tx.objectStore('meta').clear();
        tx.oncomplete = function () { res(); };
      });
    });
  }

  /* ---------- 股票列表（腾讯排行） ---------- */
  function listUrl(p, n) {
    return 'https://proxy.finance.qq.com/ifzqgtimg/appstock/app/mktHs/rank?l=' + n + '&p=' + p + '&t=ranka/chr&o=0';
  }

  /* 仅用于后台增量补池（吸收新上市的票）。限速翻页、失败即停，
     绝不再作为主流程的唯一代码来源。 */
  function fetchStockList(onTick) {
    var codes = [], p = 1, empty = 0;
    function next() {
      if (p > 30 || empty >= 2) return Promise.resolve(codes);
      return fetch(listUrl(p, 200), { cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function (j) {
          var arr = (j && j.data) || [];
          if (!arr.length) { empty++; p++; return sleep(150).then(next); }
          var added = 0;
          arr.forEach(function (x) {
            var c = String(x.code || '');
            var num = c.slice(2);
            if (!/^\d{6}$/.test(num)) return;
            if (!/^(60|00|30)/.test(num)) return;
            if (codes.indexOf(num) < 0) { codes.push(num); added++; }
          });
          if (onTick) onTick(p);
          p++;
          return sleep(150).then(next);
        }, function () { empty++; p++; return next(); });
    }
    return next();
  }

  /* ---------- 批量快照 ---------- */
  function fetchSnapChunk(chunk) {
    var q = chunk.map(function (c) { return (c[0] === '6' ? 'sh' : 'sz') + c; }).join(',');
    return retry(function () {
      return fetch('https://qt.gtimg.cn/q=' + q, { cache: 'no-store' }).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.arrayBuffer();
      });
    }).then(function (b) {
      var txt = new TextDecoder('gbk').decode(b);
      var out = [];
      txt.split(';').forEach(function (seg) {
        var m = seg.match(/v_(sh|sz)(\d{6})="([^"]*)"/);
        if (!m) return;
        var f = m[3].split('~');
        if (f.length < 46) return;
        var price = +f[3], prev = +f[4];
        if (!(price > 0) || !(prev > 0)) return;
        out.push({
          code: m[2], name: f[1],
          open: +f[5], high: +f[33], low: +f[34],
          close: price, prev: prev,
          vol: +f[6], turnover: +f[38],
          pe: +f[39] || 0, nmc: (+f[44] || 0) * 10000,
          time: f[30] || '',
          barDate: /^\d{8}/.test(f[30] || '') ? f[30].slice(0, 4) + '-' + f[30].slice(4, 6) + '-' + f[30].slice(6, 8) : ''
        });
      });
      return out;
    });
  }

  /* 本地代码池：内置 UNIVERSE（零请求，永远不会被限流）+ localStorage 里记下的增量。
     旧版这里直接依赖排行接口翻 29 页，接口一被限流就 0 只行情，且清空数据后
     唯一的代码来源就断了 —— 这是「清空后一直加载不出来」的根因。 */
  function localUniverse() {
    var out = [], seen = {};
    UNIVERSE.forEach(function (c) { if (!seen[c]) { seen[c] = 1; out.push(c); } });
    try {
      var ex = JSON.parse(localStorage.getItem('tdx_universe_v1') || '[]');
      if (ex && ex.length) ex.forEach(function (c) {
        if (/^\d{6}$/.test(c) && !seen[c]) { seen[c] = 1; out.push(c); }
      });
    } catch (e) { }
    return out;
  }

  function saveUniverse(codes) {
    try { localStorage.setItem('tdx_universe_v1', JSON.stringify(codes)); } catch (e) { }
  }

  function fetchSnapshot(codes, onTick) {
    return Promise.resolve(codes && codes.length ? codes : localUniverse()).then(function (list) {
      if (!list || !list.length) throw new Error('没有可用的股票代码池');
      var chunks = [];
      for (var i = 0; i < list.length; i += BATCH) chunks.push(list.slice(i, i + BATCH));
      var out = [], fail = [];
      function run(chs, conc, tick) {
        return pool(chs, function (ch) {
          return fetchSnapChunk(ch).then(function (arr) { for (var i = 0; i < arr.length; i++) out.push(arr[i]); });
        }, conc, tick, function (e, ch) { fail.push(ch); });
      }
      return run(chunks, 6, onTick).then(function () {
        if (!fail.length) return;
        var again = fail; fail = [];
        // 失败的分片降并发再补一轮，避免个别分片被限流就整片丢掉
        return sleep(500).then(function () { return run(again, 3, null); });
      }).then(function () {
        if (out.length >= 500) saveUniverse(out.map(function (s) { return s.code; }));
        return out;
      });
    });
  }

  /* ---------- 日线 ---------- */
  function fetchKline(code) {
    var sym = (code[0] === '6' ? 'sh' : 'sz') + code;
    var url = 'https://web.ifzq.gtimg.cn/appstock/app/kline/kline?param=' + sym + ',day,,,' + (N_KEEP + 20);
    return retry(function () {
      return fetch(url, { cache: 'no-store' }).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      });
    }).then(function (j) {
      var node = j.data && j.data[sym];
      if (!node) throw new Error('no data');
      var arr = node.day || node.qfqday;
      if (!arr || !arr.length) throw new Error('empty');
      var st = Math.max(0, arr.length - N_KEEP);
      var n = arr.length - st;
      var o = new Int32Array(n), h = new Int32Array(n), l = new Int32Array(n),
        c = new Int32Array(n), v = new Int32Array(n), dd = new Int16Array(n);
      for (var i = 0; i < n; i++) {
        var r0 = arr[st + i];
        o[i] = Math.round(+r0[1] * 1000);
        c[i] = Math.round(+r0[2] * 1000);
        h[i] = Math.round(+r0[3] * 1000);
        l[i] = Math.round(+r0[4] * 1000);
        v[i] = Math.round(+r0[5]);
        dd[i] = dayNum(r0[0]);
      }
      return { n: n, o: o, h: h, l: l, c: c, v: v, dd: dd, bd: arr[arr.length - 1][0] };
    });
  }

  /* 取日期+收盘序列，用于把"倒数第几根K线"精确映射回真实交易日 */
  function fetchDates(code) {
    var sym = (code[0] === '6' ? 'sh' : 'sz') + code;
    var url = 'https://web.ifzq.gtimg.cn/appstock/app/kline/kline?param=' + sym + ',day,,,' + (N_KEEP + 20);
    return retry(function () {
      return fetch(url, { cache: 'no-store' }).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      });
    }).then(function (j) {
      var node = j.data && j.data[sym];
      if (!node) throw new Error('no data');
      var arr = node.day || node.qfqday;
      if (!arr || !arr.length) throw new Error('empty');
      var out = [];
      for (var i = 0; i < arr.length; i++) {
        out.push([arr[i][0], +arr[i][2]]);
      }
      return out;
    });
  }

  function fetchLatestDate() {    var url = 'https://web.ifzq.gtimg.cn/appstock/app/kline/kline?param=sh600000,day,,,3';
    return retry(function () {
      return fetch(url, { cache: 'no-store' }).then(function (r) { return r.json(); });
    }).then(function (j) {
      var arr = j.data.sh600000.day;
      return arr[arr.length - 1][0];
    });
  }

  function downloadAll(codes, have, onProgress) {
    var todo = codes.filter(function (c) { return !have.has(c); });
    var buf = [], failed = 0;
    return pool(todo, function (code) {
      return fetchKline(code).then(function (k) {
        buf.push({ code: code, v: k });
        if (buf.length >= 120) {
          var batch = buf; buf = [];
          return putKlines(batch);
        }
      }).catch(function () { failed++; });
    }, 6, function (d, t) { if (onProgress) onProgress(d, t, failed); })
      .then(function () { return buf.length ? putKlines(buf) : null; })
      .then(function () { return { ok: todo.length - failed, failed: failed, total: todo.length }; });
  }

  /* 逐只重拉日线接口（不管缓存有没有），用于同步日线的兜底校正：
     快照被限流漏掉的股票，靠它补齐最后一根K线（收盘后日线接口自带当日最终K线） */
  function refetchKlines(codes, onProgress) {
    var buf = [], failed = 0;
    return pool(codes, function (code) {
      return fetchKline(code).then(function (k) {
        buf.push({ code: code, v: k });
        if (buf.length >= 120) {
          var batch = buf; buf = [];
          return putKlines(batch);
        }
      }).catch(function () { failed++; });
    }, 6, function (d, t) { if (onProgress) onProgress(d, t, failed); })
      .then(function () { return buf.length ? putKlines(buf) : null; })
      .then(function () { return { ok: codes.length - failed, failed: failed, total: codes.length }; });
  }

  global.TDXData = {
    N_KEEP: N_KEEP,
    fetchStockList: fetchStockList,
    fetchSnapshot: fetchSnapshot,
    fetchKline: fetchKline,
    fetchDates: fetchDates,
    fetchLatestDate: fetchLatestDate,
    downloadAll: downloadAll,
    loadAllKlines: loadAllKlines,
    putKlines: putKlines,
    getMeta: getMeta,
    putMeta: putMeta,
    clearAll: clearAll,
    refetchKlines: refetchKlines,
    todayStr: todayStr,
    dayNum: dayNum,
    dayStr: dayStr,
    applyTodayBars: applyTodayBars,
    clearTodayBars: clearTodayBars,
    localSnap: localSnap,
    localLatestDate: localLatestDate,
    localUniverse: localUniverse,
    saveUniverse: saveUniverse
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* 工作台界面逻辑 */
(function () {
  'use strict';

  var STRATS = ['攻防', '高量Q', '燕双飞', '夜', '仓鼠量化', 'ZTDX'];
  var HINT = { '攻防': '9:25 竞价', '高量Q': '尾盘', '燕双飞': '尾盘', '夜': '尾盘', '仓鼠量化': '尾盘', 'ZTDX': '尾盘' };
  var LS_HIST = 'tdx_hist_v1';
  var LS_SRC = 'tdx_qsrc_v1';
  var QSRC = { qq: '腾讯自选股', em: '东方财富', th: '同花顺' };

  var S = { K: null, meta: null, rows: [], hist: [], busy: false, view: 'pick', bt: null, qsrc: 'qq' };

  function $(id) { return document.getElementById(id); }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function f64(a) { var o = new Float64Array(a.length); for (var i = 0; i < a.length; i++) o[i] = a[i]; return o; }
  function p64(a) { var o = new Float64Array(a.length); for (var i = 0; i < a.length; i++) o[i] = a[i] / 1000; return o; }

  /* ---------- 公式计算结果缓存 ----------
     选股/回测/汇总原来各跑一遍全市场 evaluate（4600 只 × 210 根 × 6 策略），
     同一份数据算三遍。这里按「代码 + 最后一根K线 + 基本面参数」做指纹，
     命中就直接复用；只保留最近 EW 根K线的信号（回测最多回溯 60 根，留够余量）。 */
  var ECACHE = new Map();
  var EW = 80;

  function kfp(k, info) {
    var n = k.n;
    return n + '|' + (k.bd || '') + '|' + k.o[n - 1] + '|' + k.h[n - 1] + '|' + k.l[n - 1] + '|'
      + k.c[n - 1] + '|' + k.v[n - 1] + '|' + info[0] + '|' + (info[2] || 0) + '|' + (info[1] || 0);
  }

  /* 三个视图统一用「最后一根缓存K线收盘价」换算流通股本，口径一致才能共享缓存 */
  function getSignals(code, k, info) {
    var fp = kfp(k, info);
    var hit = ECACHE.get(code);
    if (hit && hit.fp === fp) return hit;
    var nmcv = info[1] || 0, lastC = k.c[k.n - 1] / 1000;
    var o = p64(k.o), h = p64(k.h), l = p64(k.l), c = p64(k.c), v = f64(k.v);
    var r = TDXEngine.evaluate(o, h, l, c, v, code, info[0], info[2] || 0,
      nmcv && lastC > 0 ? nmcv / lastC : 0, nmcv);
    var w = Math.min(EW, k.n), off0 = k.n - w, sigs = {};
    STRATS.forEach(function (s) {
      var src = r[s];
      sigs[s] = src.length === w ? src : src.slice(off0);
    });
    var rec = { fp: fp, sigs: sigs, w: w, n: k.n, base: w - k.n };
    ECACHE.set(code, rec);
    return rec;
  }

  /* ---------- 个股行情外链 ---------- */
  function quoteUrl(code) {
    var m = code.charAt(0) === '6' ? 'sh' : 'sz';
    if (S.qsrc === 'em') return 'https://wap.eastmoney.com/quote/stock/' + (m === 'sh' ? '1' : '0') + '.' + code + '.html';
    if (S.qsrc === 'th') return 'https://stockpage.10jqka.com.cn/' + code + '/';
    return 'https://gu.qq.com/' + m + code;
  }
  function qlink(code, name, inner, cls) {
    return '<a class="' + (cls || 'q') + '" href="' + quoteUrl(code) + '" target="_blank" rel="noopener" '
      + 'title="' + esc(name) + ' ' + code + ' 行情">' + inner + '</a>';
  }

  function stage(msg, pct, cls) {
    $('msg').textContent = msg;
    $('msg').className = 'msg ' + (cls || '');
    if (pct !== undefined && pct !== null) $('pbi').style.width = Math.max(0, Math.min(100, pct)) + '%';
  }

  function busy(on) {
    S.busy = on;
    $('go').disabled = on;
    $('bt').disabled = on;
    if ($('sm')) $('sm').disabled = on;
    $('go').textContent = on ? '运行中…' : '刷新选股';
  }

  /* ---------- 渲染 ---------- */
  function card(r) {
    var cls = r.chg > 0 ? 'up' : (r.chg < 0 ? 'down' : 'flat');
    var st = /ST/i.test(r.name) ? '<i class="st">ST</i>' : '';
    var more = r.tags.length > 1 ? '<i class="multi">' + r.tags.slice(1).join('/') + '</i>' : '';
    var sign = r.chg > 0 ? '+' : '';
    var inner = '<div class="nm">' + esc(r.name) + '<i class="jal">›</i>' + st + more + '</div>'
      + '<div class="sub">' + r.code + ' · ' + r.price.toFixed(2) + ' · 市值' + Math.round(r.nmc) + '亿 · 换手' + (r.turnover || 0) + '%</div>';
    return '<div class="item">' + qlink(r.code, r.name, inner, 'l')
      + '<div class="chg ' + cls + '">' + sign + r.chg.toFixed(2) + '%</div></div>';
  }

  function renderRows(rows, subtitle) {
    var list = $('list');
    if (!rows || !rows.length) {
      var m0 = S.meta || {};
      var cold = !((m0.count || 0) > 100 || (S.K && S.K.size > 500));
      list.innerHTML = cold
        ? '<div class="empty"><b>第一次使用</b>点右下角「刷新选股」，'
          + '会下载全市场约 4600 只股票的日线。<br>约 3–5 分钟、40MB 流量，只做一次。'
          + '<br><br>之后每天点一下，10–30 秒出结果。</div>'
        : '<div class="empty"><b>今日无命中</b>公式条件较严，弱势行情下空仓是常态。</div>';
      return;
    }
    var html = '';
    STRATS.forEach(function (s) {
      var sub = rows.filter(function (r) { return r.tags.indexOf(s) >= 0; });
      if (!sub.length) return;
      html += '<section><h2>' + s + '<em>' + sub.length + ' 只</em><small>' + (HINT[s] || '') + '</small></h2>'
        + '<div class="tb">' + sub.map(card).join('') + '</div></section>';
    });
    list.innerHTML = html;
    if (subtitle) $('meta').innerHTML = subtitle;
  }

  function renderChips() {
    var box = $('histBox'), chips = $('chips');
    if (!S.hist.length) { box.style.display = 'none'; return; }
    box.style.display = 'block';
    chips.innerHTML = S.hist.slice(0, 12).map(function (h, i) {
      return '<div class="chip' + (i === 0 ? ' on' : '') + '" data-i="' + i + '">' + h.date.slice(5) + '<u>' + h.rows.length + '</u></div>';
    }).join('');
    Array.prototype.forEach.call(chips.querySelectorAll('.chip'), function (el) {
      el.onclick = function () {
        var i = +el.dataset.i;
        Array.prototype.forEach.call(chips.querySelectorAll('.chip'), function (x) { x.classList.remove('on'); });
        el.classList.add('on');
        renderRows(S.hist[i].rows, '历史 <b>' + S.hist[i].date + '</b> ｜ 命中 <b>' + S.hist[i].rows.length + '</b> 只 ｜ ' + S.hist[i].ts);
      };
    });
  }

  function saveHist(date, rows, ts) {
    S.hist = S.hist.filter(function (h) { return h.date !== date; });
    S.hist.unshift({ date: date, ts: ts, rows: rows });
    S.hist = S.hist.slice(0, 20);
    try { localStorage.setItem(LS_HIST, JSON.stringify(S.hist)); } catch (e) { }
  }

  function updateMeta() {
    var m = S.meta || {};
    var n = S.K ? S.K.size : (m.count || 0);
    $('meta').innerHTML = '本地日线 <b>' + n + '</b> 只 ｜ 数据截止 <b>' + (m.lastDate || '—') + '</b>';
  }

  /* ---------- 选股 ---------- */
  async function ensureK() {
    if (S.K) return S.K;
    stage('读取本地日线', 3);
    S.K = await TDXData.loadAllKlines();
    return S.K;
  }

  async function runPicker() {
    if (S.busy) return;
    busy(true);
    S.view = 'pick';
    try {
      var latest = await TDXData.fetchLatestDate().catch(function () { return TDXData.todayStr(); });
      S.meta = (await TDXData.getMeta()) || {};
      var K = await ensureK();

      stage('拉取全市场行情', 8);
      // 内置代码池 + 增量池 + 已缓存代码（取并集）：
      // 既让新上市的票能进池，也不会漏掉早先下载过、但不在池子里的代码
      var uni = TDXData.localUniverse();
      if (K.size) {
        var seenC = new Set(uni);
        K.forEach(function (v, c) { if (!seenC.has(c)) { seenC.add(c); uni.push(c); } });
      }
      var snap = await TDXData.fetchSnapshot(uni, function (d, t) { stage('行情 ' + d + '/' + t, 8 + 4 * d / t); });
      var degraded = false;
      if (snap.length < 500) {
        // 快照接口挂了不等于不能算：本地已有全市场日线时，用最后两根收盘价拼出
        // 「伪快照」，跳过今日更新直接重算（口径 = 本地最后一根K线收盘）。
        // 名称/PE/流通市值沿用上次成功刷新时存下的静态数据。
        var stkPrev = (S.meta && S.meta.stocks) || {};
        var canLocal = K.size >= 500 && Object.keys(stkPrev).length > 500;
        if (canLocal && confirm('只取到 ' + snap.length + ' 只行情：快照接口 qt.gtimg.cn 没连上。\n\n'
          + '本地已有 ' + K.size + ' 只日线，可以直接用缓存重算（不更新今日行情）。\n\n'
          + '「确定」= 跳过今日更新，用本地缓存重算\n'
          + '「取消」= 放弃本次刷新，换网络后重试\n\n'
          + '降级模式下：结果为本地最后一根K线的收盘价，今天的最新价与涨跌幅拿不到，'
          + '名称、市值沿用上次刷新时的数据。')) {
          snap = TDXData.localSnap(K, stkPrev);
          degraded = true;
          if (snap.length < 500) throw new Error('本地日线可用记录只有 ' + snap.length + ' 只，不足以计算，请换网络后重试');
          latest = TDXData.localLatestDate(K) || (S.meta && S.meta.lastDate) || latest;
        } else {
          throw new Error('只取到 ' + snap.length + ' 只行情：快照接口 qt.gtimg.cn 没连上。'
            + '请换网络（数据切 Wi-Fi 或反过来）后重试，本地日线不会因此丢失');
        }
      }

      if (degraded) {
        // 没有当日行情：既不写今日K线，也不补下载新股（代码池来自快照）
        stage('降级重算：使用本地日线，未更新今日行情', 84);
      } else if (K.size < 500) {
        // 首次：下载全市场日线
        stage('首次使用，下载全市场日线（约 3-5 分钟）', 12);
        await TDXData.downloadAll(snap.map(function (s) { return s.code; }), new Set(K.keys()), function (d, t, f) {
          stage('下载日线 ' + d + '/' + t + (f ? '（失败 ' + f + '）' : ''), 12 + 72 * d / t);
        });
        K = S.K = await TDXData.loadAllKlines();
        if (K.size < 500) throw new Error('日线没写进本地存储（只有 ' + K.size + ' 只），'
          + '可能是浏览器隐私模式或存储空间不足。请退出无痕模式后重试');
        // 盘中首次下载时，日线接口还没有今天这一根，用当日快照补上
        await TDXData.applyTodayBars(snap, K);
      } else {
        // 局部补池：快照里有、本地却没有日线的（新上市），当场把日线拉下来，
        // 否则它们永远进不了选股池（以前只有点「同步日线」才会补）
        var lack = [];
        snap.forEach(function (s) { if (!K.has(s.code)) lack.push(s.code); });
        if (lack.length) {
          stage('补下载新股票日线 ' + lack.length + ' 只', 12);
          await TDXData.downloadAll(lack, new Set(), function (d, t) {
            stage('补下载日线 ' + d + '/' + t, 12 + 70 * d / t);
          });
          K = S.K = await TDXData.loadAllKlines();
        }
        // 已有缓存：把当日行情写入缓存（盘中=过程数据，收盘后=最终数据），
        // 已有今日那根则覆盖为最新，缺失则追加；不再因「落后 N 天」而放弃更新。
        stage('更新今日日线', 84);
        var rr = await TDXData.applyTodayBars(snap, K);
        if (rr.added || rr.updated || rr.fixed) {
          stage('今日日线：更新 ' + rr.updated + ' 只，追加 ' + rr.added + ' 只'
            + (rr.fixed ? '，修复重复K线 ' + rr.fixed + ' 只' : ''), 85);
        } else {
          stage('今日日线已是最新，无需写入（' + rr.noop + ' 只未变）', 85);
        }
      }

      // 降级模式没有当日行情：不覆盖「上次同步」时间与股票静态数据，
      // S.meta 保持 getMeta() 读到的旧值，面板上「上次同步」不会被认成刚同步过
      if (!degraded) {
        var stk = {};
        snap.forEach(function (s) { stk[s.code] = [s.name, s.nmc, s.pe]; });
        var tstat = todayStat(K);
        S.meta = { lastDate: tstat.hit ? tstat.today : (tstat.any || latest), updatedAt: Date.now(), stocks: stk, count: snap.length };
        await TDXData.putMeta(S.meta);
      }

      await showPick(K, snap, latest, degraded);

      // 后台增量补池（吸收新上市的票），失败静默，不影响本次结果
      TDXData.fetchStockList().then(function (cs) {
        if (cs && cs.length > 3000) TDXData.saveUniverse(cs);
      }).catch(function () { });
    } catch (e) {
      stage('出错：' + e.message, 100, 'err');
      console.error(e);
    } finally {
      busy(false);
    }
  }

  /* 选股结果渲染（选股页与「同步日线」的降级重算共用） */
  async function showPick(K, snap, latest, degraded) {
    stage('计算六大策略', 86);
    var res = await compute(K, snap);
    var rows = res.rows, ts = fmtTs();
    S.rows = rows;
    renderRows(rows, '数据 <b>' + latest + '</b> ｜ 命中 <b>' + rows.length + '</b> 只 ｜ ' + ts
      + (res.miss ? ' ｜ <i class="hintw">' + res.miss + ' 只无行情</i>' : '')
      + (degraded ? ' ｜ <i class="hintw">降级：本地缓存，未含今日行情</i>' : ''));
    // 降级结果不写历史：免得把「上一交易日口径」冒充成今天的选股记录
    if (!degraded) saveHist(latest, rows, ts);
    renderChips();
    updateMeta();
    refreshPanel();
    stage(degraded
      ? '完成（降级模式）：命中 ' + rows.length + ' 只，口径为本地最后一根K线，未包含今日行情'
      : (res.miss
        ? '完成，命中 ' + rows.length + ' 只；另有 ' + res.miss + ' 只没取到行情（停牌或限流），未参与计算，点「同步日线」可补齐'
        : '完成，命中 ' + rows.length + ' 只'), 100, (degraded || res.miss) ? 'err' : '');
    $('cp').disabled = !rows.length;
  }

  async function compute(K, snap) {
    var mm = new Map();
    snap.forEach(function (s) { mm.set(s.code, s); });
    var codes = [];
    K.forEach(function (v, k) { if (mm.has(k)) codes.push(k); });
    var rows = [];
    var CH = 250;
    for (var i = 0; i < codes.length; i += CH) {
      var end = Math.min(i + CH, codes.length);
      for (var j = i; j < end; j++) {
        var code = codes[j], k = K.get(code), m = mm.get(code);
        if (!k || k.n < 130) continue;
        var rec = getSignals(code, k, [m.name, m.nmc, m.pe]);
        var tags = [];
        for (var s = 0; s < STRATS.length; s++) if (rec.sigs[STRATS[s]][rec.w - 1]) tags.push(STRATS[s]);
        if (tags.length) {
          rows.push({
            code: code, name: m.name, price: m.close,
            chg: (m.close / m.prev - 1) * 100, nmc: m.nmc / 10000,
            turnover: m.turnover, tags: tags
          });
        }
      }
      stage('计算中 ' + end + '/' + codes.length, 86 + 12 * end / codes.length);
      await sleep(0);
    }
    rows.sort(function (a, b) { return STRATS.indexOf(a.tags[0]) - STRATS.indexOf(b.tags[0]); });
    // K 里有、快照没给行情的股票（分片被限流）根本没参与计算，要如实告诉用户
    return { rows: rows, miss: Math.max(0, K.size - codes.length) };
  }

  /* 盘中点「刷新选股」会把今日未收盘的K线写进缓存。回测把它当成持有期末价，
     最近几笔就会被半天数据带偏，所以盘中最后一根直接剔除，只用已收盘的K线。 */
  function partialLastBar(K) {
    var t = TDXData.todayStr(), hit = 0, cnt = 0;
    K.forEach(function (k) { if (cnt++ < 400 && k.bd === t) hit++; });
    if (!hit) return false;                       // 最后一根不是今天 → 那天已经收盘
    var d = new Date(), wd = d.getDay();
    if (wd === 0 || wd === 6) return false;       // 周末看到的只能是补写的历史数据
    return d.getHours() * 60 + d.getMinutes() < 15 * 60 + 5;
  }

  /* ---------- 回测 ---------- */
  async function runBacktest() {
    if (S.busy) return;
    busy(true);
    S.view = 'bt';
    try {
      var K = await ensureK();
      if (K.size < 500) throw new Error('本地日线数据不足（' + K.size + ' 只，可能被浏览器清理），先点「刷新选股」重新下载');
      S.meta = (await TDXData.getMeta()) || {};
      var stk = S.meta.stocks || {};
      if (!Object.keys(stk).length) throw new Error('缺少股票名称与市值，请先点一次「刷新选股」');

      var DAYS = 60, ATK = '攻防';
      var pool = {}, bench = { 1: [], 3: [], 5: [] }, sig = {};
      STRATS.forEach(function (s) { pool[s] = { 1: [], 3: [], 5: [] }; sig[s] = 0; });
      /* 成交价口径（与「入选汇总」页的入选价一致）：
         攻防是 9:25 竞价信号，开盘就能成交 → 信号日开盘价；
         其余策略尾盘才出信号 → 信号日收盘价。
         旧版统一用「次日开盘价」，与汇总页价格对不上，且对攻防多等了一天。 */
      var partial = partialLastBar(K);   // 盘中最后一根还没收盘，不能当持有期末价
      var codes = Array.from(K.keys());
      var CH = 200;
      for (var i = 0; i < codes.length; i += CH) {
        var end = Math.min(i + CH, codes.length);
        for (var j = i; j < end; j++) {
          var code = codes[j], k = K.get(code), info = stk[code];
          if (!k || !info || k.n < 135) continue;
          var o = p64(k.o), h = p64(k.h), l = p64(k.l), c = p64(k.c);
          // 与「刷新选股」同口径传参：pe 缺失按 0 处理（亏损股不参与燕双飞/夜），
          // 不能用假 PE=10 兜底，否则回测会把选股页根本不会选的股票算进来
          var rec = getSignals(code, k, info), sgBase = rec.base;
          var last = partial ? k.n - 2 : k.n - 1;      // 最后一个已收盘K线的下标
          var from = Math.max(0, last - DAYS + 1), to = last - 5;
          // 基准：全市场等权，同样按收盘价买入，和「尾盘」口径对齐
          for (var b = from; b <= to; b++) {
            var buy0 = c[b];
            if (!(buy0 > 0)) continue;
            [1, 3, 5].forEach(function (d) {
              var px = c[b + d];
              if (px > 0) bench[d].push(px / buy0 - 1);
            });
          }
          for (var s = 0; s < STRATS.length; s++) {
            var nm = STRATS[s], atk = (nm === ATK), arr = rec.sigs[nm];
            for (var b2 = from; b2 <= to; b2++) {
              if (!arr[b2 + sgBase]) continue;
              var buy = atk ? o[b2] : c[b2];
              if (!(buy > 0)) continue;
              if (h[b2] === l[b2]) continue;          // 一字板/停牌：当天没有可成交的价格
              sig[nm]++;
              [1, 3, 5].forEach(function (d) {
                var px = c[b2 + d];
                if (px > 0) pool[nm][d].push(px / buy - 1);
              });
            }
          }
        }
        stage('回测中 ' + end + '/' + codes.length, 100 * end / codes.length);
        await sleep(0);
      }

      function st(a) {
        if (!a.length) return null;
        var s = 0, w = 0, mx = -9, mn = 9;
        for (var i = 0; i < a.length; i++) { s += a[i]; if (a[i] > 0) w++; if (a[i] > mx) mx = a[i]; if (a[i] < mn) mn = a[i]; }
        return { n: a.length, win: w / a.length * 100, avg: s / a.length * 100, best: mx * 100, worst: mn * 100 };
      }
      var out = { rows: [], bench: {}, days: DAYS, ts: fmtTs(), partial: partial };
      [1, 3, 5].forEach(function (d) { out.bench[d] = st(bench[d]); });
      var all = { 1: [], 3: [], 5: [] };
      STRATS.forEach(function (s) {
        [1, 3, 5].forEach(function (d) { all[d] = all[d].concat(pool[s][d]); });
        out.rows.push({ name: s, sig: sig[s], d1: st(pool[s][1]), d3: st(pool[s][3]), d5: st(pool[s][5]) });
      });
      out.overall = { d1: st(all[1]), d3: st(all[3]), d5: st(all[5]) };
      S.bt = out;
      renderBT(out);
      stage('回测完成', 100);
    } catch (e) {
      stage('出错：' + e.message, 100, 'err');
    } finally {
      busy(false);
    }
  }

  /* ---------- 入选汇总（近 10 个交易日） ---------- */
  var SUMDAYS = 10;
  var SCOL = [
    { k: 'name', t: '个股', w: 84 },
    { k: 'last', t: '最新价', w: 48, num: 1 },
    { k: 'date', t: '入选日', w: 50 },
    { k: 'p0', t: '入选价', w: 48, num: 1 },
    { k: 'chg', t: '入选涨幅', w: 56, num: 1, p: 1 },
    { k: 'r1', t: '近1日', w: 52, num: 1, p: 1 },
    { k: 'r3', t: '近3日', w: 52, num: 1, p: 1 },
    { k: 'r5', t: '近5日', w: 52, num: 1, p: 1 },
    { k: 'r10', t: '近10日', w: 54, num: 1, p: 1 }
  ];

  function backPick() {
    S.view = 'pick';
    renderRows(S.rows, null);
    var m = S.meta || {};
    $('meta').innerHTML = '数据 <b>' + (m.lastDate || '—') + '</b> ｜ 命中 <b>' + S.rows.length + '</b> 只';
    renderChips();
  }

  async function runSummary() {
    if (S.busy) return;
    busy(true);
    S.view = 'sum';
    try {
      var K = await ensureK();
      if (K.size < 500) throw new Error('本地日线数据不足（' + K.size + ' 只，可能被浏览器清理），先点「刷新选股」重新下载');
      S.meta = (await TDXData.getMeta()) || {};
      var stk = S.meta.stocks || {};
      if (!Object.keys(stk).length) throw new Error('缺少股票名称与市值，请先点一次「刷新选股」');

      var codes = Array.from(K.keys());
      var picks = [], CH = 250;
      for (var i = 0; i < codes.length; i += CH) {
        var end = Math.min(i + CH, codes.length);
        for (var j = i; j < end; j++) {
          var code = codes[j], k = K.get(code), info = stk[code];
          if (!k || !info || k.n < 140) continue;
          var o = p64(k.o), c = p64(k.c);
          var lastN = c[k.n - 1];
          var rec = getSignals(code, k, info), sgBase = rec.base;
          for (var off = 0; off < SUMDAYS; off++) {
            var idx = k.n - 1 - off;
            if (idx < 130 || idx < 1) continue;
            var tags = [];
            for (var s = 0; s < STRATS.length; s++) if (rec.sigs[STRATS[s]][idx + sgBase]) tags.push(STRATS[s]);
            if (!tags.length) continue;
            // 攻防是 9:25 竞价策略，入选价取当日开盘价；其余策略为尾盘，取收盘价
            var atk = tags.indexOf('攻防') >= 0;
            var p0 = atk ? o[idx] : c[idx];
            picks.push({
              code: code, name: info[0], tags: tags, off: off, atk: atk,
              p0: p0, chg: (p0 / c[idx - 1] - 1) * 100, last: lastN,
              r1: k.n >= 2 ? (lastN / c[k.n - 2] - 1) * 100 : null,
              r3: k.n >= 4 ? (lastN / c[k.n - 4] - 1) * 100 : null,
              r5: k.n >= 6 ? (lastN / c[k.n - 6] - 1) * 100 : null,
              r10: k.n >= 11 ? (lastN / c[k.n - 11] - 1) * 100 : null,
              date: '', cLast: lastN, cPrev: k.n >= 2 ? c[k.n - 2] : null
            });
          }
        }
        stage('回算信号 ' + end + '/' + codes.length, 70 * end / codes.length);
        await sleep(0);
      }

      if (!picks.length) {
        S.sum = { rows: [], n: 0, date: S.meta.lastDate || '—' };
        renderSum();
        stage('近 10 个交易日无入选', 100);
        return;
      }

      // 日期对齐：日线缓存里已带日期序列（dd），本地直接映射成真实交易日，
      // 不再逐只重拉日线接口（以前几百只入选股 = 几百次全量请求）。
      // 早期版本存下的缓存没有 dd，才回退到网络对齐。
      var needNet = [], netSeen = {};
      picks.forEach(function (p) {
        var k = K.get(p.code);
        if (k && k.dd && k.dd.length === k.n) {
          var ix = k.n - 1 - p.off;
          if (ix >= 0 && ix < k.dd.length) p.date = TDXData.dayStr(k.dd[ix]);
        } else if (!netSeen[p.code]) {
          netSeen[p.code] = 1;
          needNet.push(p.code);
        }
      });

      if (needNet.length) {
        var dmap = {}, done = 0, qi = 0;
        stage('对齐交易日 ' + needNet.length + ' 只（旧缓存）', 72);
        async function worker() {
          while (qi < needNet.length) {
            var cc = needNet[qi++];
            try { dmap[cc] = await TDXData.fetchDates(cc); } catch (e) { dmap[cc] = null; }
            done++;
            if (done % 4 === 0 || done === needNet.length) {
              stage('对齐交易日 ' + done + '/' + needNet.length, 72 + 25 * done / needNet.length);
              await sleep(0);
            }
          }
        }
        var ws = [];
        for (var w = 0; w < 6; w++) ws.push(worker());
        await Promise.all(ws);

        function alignDelta(arr, cLast, cPrev) {
          // 接口可能比本地缓存多出今天这一根，用最后两根收盘价倒推错位量
          for (var back = 0; back < 6 && back < arr.length; back++) {
            var ix = arr.length - 1 - back;
            if (Math.abs(arr[ix][1] - cLast) <= 0.0015) {
              if (ix >= 1 && cPrev !== null) {
                if (Math.abs(arr[ix - 1][1] - cPrev) <= 0.0015) return back;
                continue;
              }
              return back;
            }
          }
          return 0;
        }
        picks.forEach(function (p) {
          if (p.date) return;
          var arr = dmap[p.code];
          if (!arr || !arr.length) return;
          var delta = alignDelta(arr, p.cLast, p.cPrev);
          var ix = arr.length - 1 - delta - p.off;
          if (ix >= 0) p.date = arr[ix][0];
        });
      }

      picks.sort(function (a, b) {
        if (a.date !== b.date) return a.date < b.date ? 1 : -1;
        return b.chg - a.chg;
      });

      var uq = {}, uqn = 0;
      picks.forEach(function (p) { if (!uq[p.code]) { uq[p.code] = 1; uqn++; } });
      S.sum = { rows: picks, n: uqn, date: S.meta.lastDate || '—', ts: fmtTs() };
      if (!S.sort) S.sort = { k: 'date', d: -1 };
      renderSum(true);
      stage('汇总完成：' + picks.length + ' 条', 100);
    } catch (e) {
      stage('出错：' + e.message, 100, 'err');
      $('list').innerHTML = '<div class="btop"><button class="back" id="back">‹ 返回选股</button>'
        + '<div class="btt">近 ' + SUMDAYS + ' 个交易日入选汇总</div></div>'
        + '<div class="empty"><b>无法生成汇总</b>' + esc(e.message) + '</div>';
      $('back').onclick = backPick;
      console.error(e);
    } finally {
      busy(false);
    }
  }

  function pcell(v) {
    if (v === null || v === undefined || isNaN(v)) return '<td class="n">—</td>';
    var c = v > 0 ? 'up' : (v < 0 ? 'down' : '');
    return '<td class="n ' + c + '">' + (v > 0 ? '+' : '') + v.toFixed(2) + '%</td>';
  }

  /* 让表格占满剩余视口高度：表头 sticky 才有意义，纵向滚动发生在表格内部。
     下限固定为「表头 + 6 行」——行高按实际渲染量出来，不同机型/字号都准，
     以前写死 240px，小屏上只露 3 行半，等于白留了半屏空白。
     ROWS_MIN 是表格最少露出的行数，调行数只改这一个常量。 */
  var ROWS_MIN = 6;
  function fitSum(align) {
    var wrap = $('list') && $('list').querySelector('.tw');
    if (!wrap) return;
    wrap.style.maxHeight = '';
    var dock = document.querySelector('.dock');
    var dh = dock ? dock.getBoundingClientRect().height : 0;
    var top = wrap.getBoundingClientRect().top;
    if (align && top < 8) {
      // 用户是从列表页滚着进来的，把表格顶拉到视口上沿，否则表头会被切掉
      window.scrollBy(0, Math.ceil(top) - 8);
      top = wrap.getBoundingClientRect().top;
    }
    var tbl = wrap.querySelector('table');
    var headEl = tbl && tbl.querySelector('thead');
    var rowEl = tbl && tbl.tBodies[0] && tbl.tBodies[0].rows[0];
    var headH = (headEl && headEl.offsetHeight) || 34;
    var rowH = (rowEl && rowEl.offsetHeight) || 46;
    // 表格能横向滚动，非 overlay 滚动条会吃掉十几像素高度（手机 Safari/Chrome 多为 0），
    // 不计进去的话「表头 + 6 行」刚好差一点点，第 6 行只露半截
    var sbH = Math.max(0, wrap.offsetHeight - wrap.clientHeight);
    var floor = Math.round(headH + rowH * ROWS_MIN + sbH + 2);   // 至少 ROWS_MIN 只股票
    var avail = window.innerHeight - Math.min(Math.max(top, 8), window.innerHeight - 260) - dh - 12;
    var h = Math.max(floor, Math.round(avail));
    wrap.style.maxHeight = h + 'px';
    // 二次校正：尽量让整页不再纵向可滚，否则滑动页面会把表头带出屏幕；
    // 但再挤也不能低于 ROWS_MIN 行，宁可让页面多滚一点
    for (var i = 0; i < 2; i++) {
      var over = document.scrollingElement.scrollHeight - window.innerHeight;
      if (over <= 0) break;
      var nh = Math.max(floor, h - over);
      if (nh === h) break;
      h = nh;
      wrap.style.maxHeight = h + 'px';
    }
  }

  function renderSum(align) {
    var o = S.sum;
    var head = '<div class="btop"><button class="back" id="back">‹ 返回选股</button>'
      + '<div class="btt">近 ' + SUMDAYS + ' 个交易日入选</div></div>';
    if (!o || !o.rows.length) {
      $('list').innerHTML = head + '<div class="empty">'
        + (S.sum ? '<b>暂无记录</b>近 10 个交易日没有选出股票。'
          : '<b>汇总已失效</b>今日K线有改动，点底部「汇总」重新计算。') + '</div>';
      $('meta').innerHTML = '入选汇总 ｜ 近 ' + SUMDAYS + ' 个交易日 ｜ 截止 <b>' + (o ? o.date : '—') + '</b>';
      $('histBox').style.display = 'none';
      $('back').onclick = backPick;
      return;
    }
    if (!S.sort) S.sort = { k: 'date', d: -1 };
    var sk = S.sort.k, sd = S.sort.d;
    var atkN = 0;
    o.rows.forEach(function (r) { if (r.atk) atkN++; });
    var rows = o.rows.slice();
    rows.sort(function (a, b) {
      var x = a[sk], y = b[sk];
      if (sk === 'name') return sd * String(x).localeCompare(String(y), 'zh');
      var nx = (x === null || x === undefined || x === '') ? -1e9 : Number(x);
      var ny = (y === null || y === undefined || y === '') ? -1e9 : Number(y);
      if (nx === ny) return 0;
      return sd * (nx - ny);
    });

    var body = rows.map(function (r) {
      var d = r.date ? r.date.slice(5) : '—';
      return '<tr>'
        + '<td class="nm">' + qlink(r.code, r.name, '<b>' + esc(r.name) + '</b><i>' + r.code + '</i>')
        + '<s>' + r.tags.join('·') + '</s></td>'
        + '<td class="n">' + r.last.toFixed(2) + '</td>'
        + '<td class="dt">' + d + '</td>'
        + '<td class="n"' + (r.atk ? ' title="9:25 竞价开盘价"' : '') + '>' + r.p0.toFixed(2) + '</td>'
        + pcell(r.chg) + pcell(r.r1) + pcell(r.r3) + pcell(r.r5) + pcell(r.r10)
        + '</tr>';
    }).join('');

    var cols = SCOL.map(function (c) { return '<col style="width:' + c.w + 'px">'; }).join('');
    var ths = SCOL.map(function (c) {
      var on = sk === c.k;
      return '<th data-k="' + c.k + '" class="' + (c.num ? 'n' : '') + (on ? ' on' : '') + (c.k === 'name' ? ' sep' : '') + '">'
        + c.t + (on ? (sd < 0 ? '<u>↓</u>' : '<u>↑</u>') : '') + '</th>';
    }).join('');

    $('list').innerHTML = head
      + '<div class="smeta">共 <b>' + o.rows.length + '</b> 条记录 ｜ 涉及 <b>' + o.n + '</b> 只个股'
      + (atkN ? ' ｜ 攻防 <b>' + atkN + '</b> 条按开盘价' : '') + '</div>'
      + '<div class="sorts">当前按 <b>' + (SCOL.filter(function (c) { return c.k === sk; })[0] || { t: sk }).t
      + ' ' + (sd < 0 ? '降序' : '升序') + '</b>　·　点表头排序　·　点名称看行情</div>'
      + '<div class="tw"><table><colgroup>' + cols + '</colgroup>'
      + '<thead><tr>' + ths + '</tr></thead><tbody>' + body + '</tbody></table></div>'
      + '<details class="note"><summary>口径与偏差说明（点击展开）</summary>'
      + '入选价＝入选日收盘价，<b>攻防按当日 9:25 竞价开盘价</b>，入选涨幅随之按该价格算；'
      + '最新价＝最新一根 K 线收盘，近 N 日＝相对 N 个交易日前；同一只股票不同日期入选分行列出，日线不复权。'
      + '<br><b>注意</b>：历史信号里的 PE、流通市值过滤用的是当前值，存在前视偏差，'
      + '历史入选只适合复盘信号形态，不宜直接当真实可成交记录。</details>';

    $('meta').innerHTML = '入选汇总 ｜ 近 ' + SUMDAYS + ' 个交易日 ｜ 截止 <b>' + o.date + '</b>';
    $('histBox').style.display = 'none';
    $('back').onclick = backPick;
    fitSum(!!align);
    // 展开/收起口径说明会改变下方高度，重新量一次表格可用空间
    var dt = $('list').querySelector('details.note');
    if (dt) dt.addEventListener('toggle', function () { fitSum(false); });
    Array.prototype.forEach.call($('list').querySelectorAll('th'), function (th) {
      th.onclick = function () {
        var k = th.getAttribute('data-k');
        if (S.sort.k === k) S.sort.d = -S.sort.d;
        else { S.sort.k = k; S.sort.d = (k === 'name') ? 1 : -1; }
        renderSum(false);
      };
    });
  }

  function pct(x, d) { if (x === null) return '—'; return (x > 0 ? '+' : '') + x.toFixed(d || 2) + '%'; }

  function renderBT(o) {
    var m0 = S.meta || {};
    var h = '<div class="btop"><button class="back" id="back">‹ 返回选股</button>'
      + '<div class="btt">近 ' + o.days + ' 个交易日 ｜ 信号日买入</div></div>';
    h += '<div class="bench">成交价　攻防 <b>信号日 9:25 开盘价</b>　其余 <b>信号日收盘价</b>'
      + (m0.lastDate ? '<br>数据截止 <b>' + m0.lastDate + '</b>' : '')
      + (o.partial ? '　（今日未收盘，已剔除）' : '') + '　·　与「汇总」页入选价同口径</div>';
    if (o.bench[5]) {
      h += '<div class="bench">全市场基准（等权，收盘价买入）　1日 <b class="' + cls(o.bench[1].avg) + '">' + pct(o.bench[1].avg) + '</b>'
        + '　5日 <b class="' + cls(o.bench[5].avg) + '">' + pct(o.bench[5].avg) + '</b></div>';
    }
    if (o.overall.d5) {
      h += '<div class="bench">全部信号 ' + o.overall.d5.n + ' 笔　1日胜率 <b>' + o.overall.d1.win.toFixed(0) + '%</b>'
        + '　5日均值 <b class="' + cls(o.overall.d5.avg) + '">' + pct(o.overall.d5.avg) + '</b></div>';
    }
    o.rows.forEach(function (r) {
      var way = r.name === '攻防' ? '9:25 开盘价买入' : '收盘价买入';
      if (!r.d1) {
        h += '<section><h2>' + r.name + '<em>0 笔</em><small>' + way + '</small></h2><div class="kbox dim">样本不足</div></section>';
        return;
      }
      h += '<section><h2>' + r.name + '<em>' + r.sig + ' 笔</em><small>' + way + '</small></h2><div class="kbox">'
        + kpi('1日胜率', r.d1.win.toFixed(0) + '%', '')
        + kpi('1日均值', pct(r.d1.avg), cls(r.d1.avg))
        + (r.d3 ? kpi('3日胜率', r.d3.win.toFixed(0) + '%', '') + kpi('3日均值', pct(r.d3.avg), cls(r.d3.avg)) : '')
        + kpi('5日胜率', r.d5.win.toFixed(0) + '%', '')
        + kpi('5日均值', pct(r.d5.avg), cls(r.d5.avg))
        + kpi('5日最好', pct(r.d5.best, 1), 'up')
        + kpi('5日最差', pct(r.d5.worst, 1), 'down')
        + '</div></section>';
    });
    h += '<div class="note">口径：攻防按信号日 9:25 开盘价成交，其余策略按信号日收盘价成交（与「汇总」页入选价一致），'
      + '持有至第 N 个交易日收盘。一字板/停牌当天无可成交价，已剔除；不含手续费与滑点，'
      + '日线不复权，除权日会有跳空误差；盘中今日最后一根未收盘，不计入。样本少于一二十笔的策略，统计意义有限。'
      + '<br><b>已知偏差</b>：燕双飞/夜用 PE、流通市值做过滤，回测用的是<b>当前</b>值去套历史信号（前视偏差）；'
      + '股票池为当前在市股票，已退市股不在样本内（幸存者偏差）。真实收益通常低于此处数值。</div>';
    $('list').innerHTML = h;
    $('back').onclick = backPick;
  }

  function kpi(label, val, c) {
    return '<div class="k"><span>' + label + '</span><b class="' + (c || '') + '">' + val + '</b></div>';
  }
  function cls(v) { return v > 0 ? 'up' : (v < 0 ? 'down' : ''); }

  /* ---------- 数据面板 ---------- */
  function togglePanel() {
    var p = $('panel');
    p.classList.toggle('on');
    if (p.classList.contains('on')) refreshPanel();
  }

  async function refreshPanel() {
    var m = (await TDXData.getMeta()) || {};
    var n = S.K ? S.K.size : 0;
    if (!n) { S.K = await TDXData.loadAllKlines(); n = S.K.size; }
    var hs = todayStat(S.K);
    $('ptxt').innerHTML = '本地股票 <b>' + n + '</b> 只<br>数据截止 <b>' + (m.lastDate || (n ? '今日已清空，请刷新' : '—')) + '</b>'
      + '<br>今日K线 <b>' + (hs.hit ? '已写入 ' + hs.hit + ' 只（盘中为过程数据）'
        : (hs.cleared ? '已清空 ' + hs.cleared + ' 只，请点「刷新选股」或「同步日线」补回' : '无')) + '</b>'
      + '<br>上次同步 ' + (m.updatedAt ? new Date(m.updatedAt).toLocaleString('zh-CN') : '—');
  }

  /* 统计缓存里「今日」K线的写入情况，用于 meta.lastDate 与面板展示 */
  function todayStat(K) {
    var t = TDXData.todayStr(), hit = 0, tot = 0, any = '', cleared = 0;
    if (K) K.forEach(function (k) {
      if (k.cl) cleared++;
      if (!k.bd) return;
      tot++; any = any || k.bd;
      if (k.bd === t) hit++;
    });
    return { hit: hit, tot: tot, any: any, cleared: cleared, today: t };
  }

  async function syncDaily() {
    if (S.busy) return;
    busy(true);
    var okDone = false;
    try {
      var K = await ensureK();
      stage('拉取全市场行情', 4);
      var snap = await TDXData.fetchSnapshot(null, function (d, t) { stage('行情 ' + d + '/' + t, 4 + 16 * d / t); });
      if (snap.length < 500) {
        // 同步的意义就是补今日数据，补不了就问用户是否只拿本地缓存重算一遍
        var mPrev = (await TDXData.getMeta()) || {};
        var stkPrev = mPrev.stocks || {};
        var canLocal = K.size >= 500 && Object.keys(stkPrev).length > 500;
        if (!canLocal || !confirm('只取到 ' + snap.length + ' 只行情：快照接口 qt.gtimg.cn 没连上，今日K线补不了。\n\n'
          + '「确定」= 跳过同步，直接用本地 ' + K.size + ' 只日线重算选股\n'
          + '「取消」= 放弃本次同步，换网络后重试\n\n'
          + '本地日线不会丢，只是今天的最新价与涨跌幅拿不到。')) {
          throw new Error('只取到 ' + snap.length + ' 只行情：快照接口 qt.gtimg.cn 没连上，'
            + '今日数据无法补齐。请换网络后重试（本地日线不受影响）');
        }
        S.view = 'pick';
        await showPick(K, TDXData.localSnap(K, stkPrev),
          TDXData.localLatestDate(K) || mPrev.lastDate || TDXData.todayStr(), true);
        return;
      }

      var have = new Set(K.keys());
      stage('同步日线 ' + have.size + '/' + snap.length, 22);
      var r = await TDXData.downloadAll(snap.map(function (s) { return s.code; }), have, function (d, t, f) {
        stage('同步日线 ' + d + '/' + t + (f ? '（失败 ' + f + '）' : ''), 22 + 50 * d / t);
      });
      S.K = await TDXData.loadAllKlines();
      stage('写入今日日线', 74);
      var rr = await TDXData.applyTodayBars(snap, S.K);

      // 兜底校正：快照可能被限流漏掉一批股票（失败会被静默吞掉），凡最后一根
      // 既不是今日、也不是最近交易日的，逐只重拉日线接口补齐最后一根。
      // 收盘后日线接口自带当日最终K线，所以清空今日后点「同步日线」一定能补回。
      var latest = await TDXData.fetchLatestDate().catch(function () { return TDXData.todayStr(); });
      var today = TDXData.todayStr(), lag = [];
      S.K.forEach(function (k, code) { if (k.bd !== today && k.bd !== latest) lag.push(code); });
      if (lag.length) {
        stage('补拉缺今日K线 ' + lag.length + ' 只', 76);
        var rf = await TDXData.refetchKlines(lag, function (d, t, f) {
          stage('补拉缺今日K线 ' + d + '/' + t + (f ? '（失败 ' + f + '）' : ''), 76 + 14 * d / t);
        });
      }

      var m0 = (await TDXData.getMeta()) || {};
      var ts = todayStat(S.K);
      m0.lastDate = ts.hit ? ts.today : (ts.any || latest);
      m0.updatedAt = Date.now();
      S.meta = m0;
      await TDXData.putMeta(m0);
      stage('同步完成：新增 ' + r.ok + ' 只 ｜ 今日K线 覆盖 ' + rr.updated + ' / 追加 ' + rr.added
        + (rr.fixed ? ' ｜ 修复重复 ' + rr.fixed : '')
        + ((rr.added || rr.updated || rr.fixed) ? '' : '（其余 ' + rr.noop + ' 只未变，已跳过写入）')
        + (lag.length ? ' ｜ 补拉 ' + lag.length + ' 只' + (rf && rf.failed ? '（失败 ' + rf.failed + '）' : '') : ''), 100);
      updateMeta();
      refreshPanel();
      okDone = true;
    } catch (e) {
      stage('同步失败：' + e.message, 100, 'err');
    } finally { busy(false); }
    // 数据变了，停在汇总页就直接重算，避免用户看到的是同步前的旧结果
    if (okDone && S.view === 'sum') { stage('数据已更新，重算汇总…', 50); await runSummary(); }
  }

  async function wipe() {
    if (!confirm('清空本地日线数据？\n\n下次点「刷新选股」需要重新下载全市场日线（3-5 分钟、约 40MB 流量）。\n股票代码池会保留，不需要重新拉列表。')) return;
    await TDXData.clearAll();
    S.K = null; S.meta = null;
    ECACHE.clear();
    stage('本地日线已清空，股票代码池已保留。点「刷新选股」重新下载即可', 0);
    updateMeta(); refreshPanel();
  }

  async function clearToday() {
    if (S.busy) return;
    if (!confirm('清空缓存里的「今日」K线？\n用于剔除盘中过程数据。清空后点「同步日线」或「刷新选股」即可补回今日最终数据。')) return;
    busy(true);
    try {
      var K = await ensureK();
      var n = await TDXData.clearTodayBars(K);
      var m = (await TDXData.getMeta()) || {};
      if (m.lastDate === TDXData.todayStr()) { m.lastDate = ''; m.updatedAt = Date.now(); await TDXData.putMeta(m); }
      S.meta = m;
      if (n) S.sum = null;   // 今日K线已变，之前的汇总结果作废
      stage(n ? '已清除 ' + n + ' 只的今日K线，请点「刷新选股」或「同步日线」补回' : '缓存中没有今日K线', n ? 55 : 0);
      updateMeta(); refreshPanel();
      if (n && S.view === 'sum') renderSum(false);
    } catch (e) {
      stage('清空今日失败：' + e.message, 100, 'err');
    } finally { busy(false); }
  }

  function fmtTs() {
    var d = new Date(), p = function (x) { return (x < 10 ? '0' : '') + x; };
    return (d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  /* ---------- 行情源 ---------- */
  function paintSrc() {
    var box = $('qsrc');
    if (!box) return;
    Array.prototype.forEach.call(box.querySelectorAll('button'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-s') === S.qsrc);
    });
  }

  function setSrc(v) {
    if (!QSRC[v] || v === S.qsrc) return;
    S.qsrc = v;
    try { localStorage.setItem(LS_SRC, v); } catch (e) { }
    paintSrc();
    if (S.view === 'sum' && S.sum) renderSum();
    else if (S.view !== 'bt' && S.rows && S.rows.length) renderRows(S.rows, null);
    stage('个股行情将跳转 ' + QSRC[v], 100);
  }

  /* ---------- 启动 ---------- */
  async function boot() {
    // 尽量申请持久化存储，降低手机浏览器自动清空 IndexedDB（日线缓存）的概率
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
    try { S.hist = JSON.parse(localStorage.getItem(LS_HIST) || '[]'); } catch (e) { S.hist = []; }
    try { var sv = localStorage.getItem(LS_SRC); if (sv && QSRC[sv]) S.qsrc = sv; } catch (e) { }
    paintSrc();
    try {
      await TDXData.getMeta();
    } catch (e) {
      stage('这台浏览器不允许本地存储，无法保存日线。请把本文件放到任意网页空间（如 GitHub Pages）后用链接打开。', 0, 'err');
      return;
    }
    S.meta = (await TDXData.getMeta()) || {};
    updateMeta();
    if (S.hist.length) {
      S.rows = S.hist[0].rows;
      renderRows(S.rows, '数据 <b>' + S.hist[0].date + '</b> ｜ 命中 <b>' + S.rows.length + '</b> 只 ｜ ' + S.hist[0].ts);
      renderChips();
      $('cp').disabled = !S.rows.length;
    } else {
      renderRows(null, null);
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    $('go').onclick = runPicker;
    $('sm').onclick = function () {
      if (S.view === 'sum' && S.sum) { backPick(); }
      else runSummary();
    };
    $('bt').onclick = function () { if (S.view === 'bt' && S.bt) { backPick(); } else runBacktest(); };
    $('gear').onclick = togglePanel;
    var lastW = window.innerWidth;
    window.addEventListener('resize', function () {
      if (Math.abs(window.innerWidth - lastW) < 20) return; // 忽略手机地址栏伸缩
      lastW = window.innerWidth;
      if (S.view === 'sum') fitSum(true);
    });
    $('sync').onclick = syncDaily;
    $('ct').onclick = clearToday;
    $('wipe').onclick = wipe;
    Array.prototype.forEach.call(document.querySelectorAll('#qsrc button'), function (b) {
      b.onclick = function () { setSrc(b.getAttribute('data-s')); };
    });
    $('cp').onclick = async function () {
      var src = (S.view === 'sum' && S.sum && S.sum.rows.length) ? S.sum.rows : S.rows;
      if (!src.length) return;
      var seen = {}, arr = [];
      src.forEach(function (r) {
        if (seen[r.code]) return;
        seen[r.code] = 1;
        arr.push(r.code + ',' + r.name);
      });
      var txt = arr.join('\n');
      try { await navigator.clipboard.writeText(txt); }
      catch (e) {
        var ta = document.createElement('textarea');
        ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
      }
      var b = $('cp'); b.textContent = '已复制';
      setTimeout(function () { b.textContent = '复制'; }, 1500);
    };
    boot();
  });
})();

</script>
</body>
</html>
